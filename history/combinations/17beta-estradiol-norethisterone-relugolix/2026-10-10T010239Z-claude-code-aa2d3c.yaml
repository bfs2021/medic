  summary: Fold thrombotic-risk examples; curate the pregnancy contraindication
  details: |
    Re-decided against DailyMed setid fc3feb73-cc84-43a8-aa32-b262460495e8 v18 under the current skill. (1) 'With a high risk of arterial, venous thrombotic, or thromboembolic disorders ... Examples include ... women who are known to have: ...' is an examples list: the fourteen per-member CONTRAINDICATED claims (DVT, PE, vascular disease and its e.g. members cerebrovascular / coronary artery / peripheral vascular disease, thrombogenic valvular / rhythm heart disease, SBE, atrial fibrillation, hypercoagulopathies, uncontrolled hypertension, headaches with focal neurological symptoms, migraine with aura) are now examples on the one thrombotic-disease claim, terms and bindings kept; nested e.g. members flattened; the migraine example's 'if over 35 years of age' restriction is recorded in notes since examples carry no age_range. (2) New CONTRAINDICATED claim for 'Who are pregnant', unbound with a term_gap, previously skipped. MYFEMBREE is a brand name, so no INGREDIENT_SUBJECT; no other attribution supported. curator_id updated.
