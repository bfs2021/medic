  details: |
    Applied the rule that a listed example with a restriction of its own is a separate claim (examples cannot carry qualifiers). Re-read DailyMed setid 786fb677-58c9-44ca-9c67-595d6be0fe7f v1 from its pin. The high-risk-of-thrombotic-disease claim loses three examples, each now its own CONTRAINDICATED_IN claim: deep vein thrombosis (HP:0002625) and pulmonary embolism (MONDO:0005279), both restricted 'now or in the past' (no slot for a temporal scope; notes state the label covers current disease and history), and migraine headaches with or without aura (MONDO:0005277) with age_range min_years 35, text 'over age 35' (the label's bound is strict; age_range has no exclusive bound). Headaches with focal neurological symptoms stay an example: the label's 'or have migraine ... if over age 35' attaches the age to migraine only. Notes added to the two breast/hormone-sensitive cancer claims recording 'now or in the past'. curator_id updated to the current skill reference.
