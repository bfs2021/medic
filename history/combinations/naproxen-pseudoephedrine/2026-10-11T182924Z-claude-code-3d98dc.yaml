  details: |
    Curated from DailyMed setid 305adca3-cdae-41e5-a10a-99d9dd0fe390 v6 (Sudafed Sinus 12 Hour Pressure plus Pain). OTC symptom list: 6 symptoms (nasal and sinus congestion split) x 2 conditions (cold, flu); the 'sinus' member of 'cold, sinus, and flu symptoms' names a site, not a condition, so gives no context. The cold context is left unbound: the grounding store maps 'cold' to COPD and the validator rejects common cold. Sinus pressure and sinus congestion unbound. Contraindication: allergic reaction to any other pain reliever/fever reducer. Not curated: under-12 age population, heart surgery, MAOI.
