  details: |
    Curated from DailyMed setid c88c3eb8-3bf5-4004-a7ab-7218cd2f9182 v1 (generic drospirenone and ethinyl estradiol tablets). Indications: contraception (pregnancy unbound), PMDD symptoms (AMELIORATES), moderate acne (acne BROADER, age >= 14, menarche unbound). Contraindications follow the levomefolate-containing precedent: renal impairment, adrenal insufficiency, each thrombotic risk factor its own claim (heading 'A high risk of ...' not curated), coordinations split with member, abnormal uterine bleeding on HP:0000140 BROADER, breast cancer, liver tumors / liver disease members. Label lists no pregnancy contraindication. Not curated: hepatitis C drug-combination interaction. All unattributed.
