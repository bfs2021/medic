  details: |
    Curated from DailyMed setid 518cc045-a12b-f08f-e063-6394a90acb0c v1. Seven indications (UTI bound NARROWER to bacterial UTI, acute otitis media in pediatric patients, AECB in adults with the exacerbation unbound and chronic bronchitis as disease context, Shigella enteritis bound to enteritis, PJP treatment and prophylaxis in immunosuppressed patients via MONDO pneumocystosis, traveler's diarrhea in adults BROADER HP Diarrhea; the adult restrictions are quoted from the subsection headings) and five contraindications (sulfonamide-antibiotic cross-sensitivity, drug-induced immune thrombocytopenia with trimethoprim/sulfonamides as agents, folate-deficiency megaloblastic anemia, marked hepatic damage BROADER liver disorder, severe renal insufficiency). Not curated: infants under 2 months (no condition), dofetilide (pure interaction), trimethoprim allergy (own ingredient). Causative organisms have no slot; nothing attributed.
