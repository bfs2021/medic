  details: |
    Curated from DailyMed setid eaf135b6-e378-4f62-a1e7-db45e23668c7 v7. Product-level type 2 diabetes indication (aged 10 years and older); contraindications severe renal impairment (HP Renal insufficiency, BROADER), end-stage renal disease, and acute or chronic metabolic acidosis (exhaustive pair, diabetic ketoacidosis as example). The renal coordination is split into two claims whose texts are the members alone, because the validator reads the eGFR parenthesis as members. The dapagliflozin-only kidney and heart-failure indications are not yet curated: the subject is 87 characters from its verb once the product name is blanked (the INGREDIENT_SUBJECT check allows 40); the planned claims are listed in the file notes. Cardiovascular death treated as an outcome, not a condition.
