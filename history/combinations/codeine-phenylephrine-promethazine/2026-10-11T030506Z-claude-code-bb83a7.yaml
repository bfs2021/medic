  details: |
    Curated from DailyMed setid 5c3c2c1b-ab52-410b-8c94-c125c6adb4d2 v1 (Promethazine VC With Codeine). The indication sentence is split per symptom (coughs; upper respiratory symptoms with nasal congestion as example) and per condition (allergy; the common cold), unattributed. Contraindications: promethazine's comatose states, hypersensitivity and idiosyncratic reaction to phenothiazines (INGREDIENT_SUBJECT promethazine), phenylephrine's hypertension and peripheral vascular insufficiency (INGREDIENT_SUBJECT phenylephrine). Not curated: own-ingredient hypersensitivities, MAOI interaction, under-6 age population, and the antihistamines/codeine lower respiratory tract sentence (a use, left for the reviewer).
