  details: |
    Curated from DailyMed setid 3dd9b060-5355-404d-bdf1-09ee8b52a9f5 v18 (ZYLET). Same claim structure as the other steroid/anti-infective ophthalmic files: 11 indication claims, 4 contraindication claims, none attributed (ZYLET is the subject of the indication and contraindication sentences; 'Ocular steroids' and 'an anti-infective component' name roles, not ingredients; the '(tobramycin) is active against' sentence is microbiology, not a claim). The 'such as' examples sit on the site member they name (allergic conjunctivitis and acne rosacea on both conjunctiva members; superficial punctate keratitis (BROADER) and herpes zoster keratitis on cornea; iritis and cyclitis on anterior segment). Herpes zoster keratitis and cyclitis have term_gaps.
