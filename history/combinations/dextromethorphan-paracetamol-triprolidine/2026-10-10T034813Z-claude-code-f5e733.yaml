    Revised under the rules of a12de84 against DailyMed setid 27f9d2db-38ce-41d2-8f1a-0eb171600274 v9. Replaced the three condition-object claims (common cold, flu, hay fever) with one AMELIORATES_CONDITION claim per listed symptom per named condition (common cold, flu): cough, minor aches and pains (Pain, BROADER), sore throat, headache, runny nose, sneezing, and itching of the nose or throat split per member (Pruritus BROADER, nose/throat as anatomical context). 'itchy, watery eyes due to hay fever' gives two claims (Ocular pruritus, object text 'itchy', NARROWER; Epiphora) with hay fever as their only context, since the item names its own cause. Kept 'temporarily reduces fever' and 'controls cough to help you get to sleep' without context. Added explanations to every claim; no attributions. Regenerated the curator block.
