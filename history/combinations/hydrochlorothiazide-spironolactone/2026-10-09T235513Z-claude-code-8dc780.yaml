  details: |
    Curated from DailyMed setid 6fa96947-f4d8-4ca4-98fd-a2c123310d83 v3. All claims product-level. Indications: edema and sodium retention (term_gap) in CHF, diuretic-induced hypokalemia in CHF and in hypertensive patients, CHF with digitalis, edema and ascites in cirrhosis, edema in nephrotic syndrome (quote runs from the Edematous conditions heading), essential hypertension, hypertension, pathologic edema in pregnancy (no pregnancy term). Contraindications: anuria, acute renal insufficiency, renal excretory impairment, hypercalcemia, hyperkalemia, Addison's disease, thiazide/sulfonamide cross-allergy, and the hedged 'may also be contraindicated' acute or severe hepatic failure (flagged). Grounding store maps Sodium retention to hypernatremia (UMLS:C0020488), flagged as wrong.
