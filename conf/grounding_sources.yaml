# Sources for building the offline lexical index.
# OBO vocabs are downloaded from their PURLs into cache/ontologies/.
# Licensed/non-OBO vocabs use local files (see background/ and the report).
diseases:
  - {prefix: MONDO, loader: obo_json, path: cache/ontologies/mondo.json}
  - {prefix: HP, loader: obo_json, path: cache/ontologies/hp.json}
  - {prefix: UMLS, loader: umls, path: background/umls-2021AA-mrconso.zip, member: MRCONSO.RRF}
  # ICD10CM dropped: redundant with UMLS (which carries ICD10CM as a source SAB); +64 groundings only.
drugs:
  - {prefix: CHEBI, loader: obo_json, path: cache/ontologies/chebi.json}
  - {prefix: DRON, loader: obo_json, path: cache/ontologies/dron.json}
  # RxNorm ingredients, from a committed table (3 columns, 0.7MB) so the index is
  # reproducible from a checkout. Regenerate against a newer OMOP/ATHENA release with
  # scripts/build_rxnorm_table.py; only that script needs the 1GB dump. The table carries
  # RxNorm content only — the bundle's SNOMED/MedDRA is excluded at extraction time, see
  # LICENSING.md.
  - {prefix: RXCUI, loader: omop_rxnorm, path: data/vocab/rxnorm_ingredients.tsv}
  # PR dropped: +15 groundings only (drug names are chemicals, not proteins).
