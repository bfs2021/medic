  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: H. pylori infection
      term:
        id: MONDO:0006781
        label: Helicobacter pylori infectious disease
      binding: EXACT
    quote: >-
      The components in lansoprazole delayed-release capsules, amoxicillin capsules, and
      clarithromycin tablets are indicated for the treatment of patients with H. pylori infection
      and duodenal ulcer disease (active or one-year history of a duodenal ulcer) to eradicate
      H. pylori .
    disease_context:
      text: duodenal ulcer disease
      term:
        id: MONDO:0005412
        label: duodenal ulcer
      binding: EXACT
    status: DRAFT
    notes: >-
      The regimen eradicates H. pylori in patients who also have duodenal ulcer disease ("active
      or one-year history"). Product-level claim ("The components in ... are indicated"),
      unattributed: the label does not assign eradication to any one component. Grounding store
      maps "H. pylori infection" to UMLS:C0850666 and "duodenal ulcer disease" to UMLS:C0013295.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: hypersensitivity reactions
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: other beta-lactam antibiotics
      term:
        id: CHEBI:27933
        label: beta-lactam antibiotic
      binding: EXACT
    examples:
