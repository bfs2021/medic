notes: >-
  Co-packaged product (lansoprazole capsules, amoxicillin capsules, clarithromycin tablets).
  Not curated: "known severe hypersensitivity to any component of the formulation of
  lansoprazole delayed-release capsules" (allergy to the product's own ingredient); the list of
  hypersensitivity reaction types (describes reactions, not a contraindication); drug-interaction
  contraindications with no condition object (PPIs with rilpivirine; clarithromycin with
  lurasidone, cisapride, pimozide, astemizole, terfenadine, ergotamine, dihydroergotamine;
  clarithromycin with lovastatin/simvastatin "due to the increase risk of myopathy"); the
  post-marketing cardiac-arrhythmia narrative. The colchicine co-administration contraindication
  in renal or hepatic impairment is curated with colchicine in when_coadministered_with; the
  statin sentence names myopathy as the risk, not a patient condition, so it stays a pure drug
  interaction. The antibacterial-stewardship paragraph in
  Indications is usage guidance, not an indication. No PREVENTATIVE_FOR_CONDITION duodenal-ulcer claim: the only
  recurrence wording is the subsection heading ("H. pylori Eradication to Reduce the Risk of
  Duodenal Ulcer Recurrence") and a study-result sentence ("has been shown to reduce the risk"),
  neither an indication statement; a reviewer may want it added.
