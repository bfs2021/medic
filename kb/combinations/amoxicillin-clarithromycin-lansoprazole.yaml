  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: H. pylori infection
      term:
        id: MONDO:0006781
        label: Helicobacter pylori infectious disease
      binding: EXACT
    quote: >-
      The components in lansoprazole delayed-release capsules, amoxicillin capsules, and
      clarithromycin tablets are indicated for the treatment of patients with H. pylori infection
      and duodenal ulcer disease (active or one-year history of a duodenal ulcer) to eradicate
      H. pylori .
    disease_context:
      text: duodenal ulcer disease
      term:
        id: MONDO:0005412
        label: duodenal ulcer
      binding: EXACT
    status: DRAFT
    notes: >-
      The regimen eradicates H. pylori in patients who also have duodenal ulcer disease ("active
      or one-year history"). Product-level claim ("The components in ... are indicated"),
      unattributed: the label does not assign eradication to any one component. Grounding store
      maps "H. pylori infection" to UMLS:C0850666 and "duodenal ulcer disease" to UMLS:C0013295.
  - relation: CONTRAINDICATED
    section: CONTRAINDICATIONS
    object:
      text: hypersensitivity reactions
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: other beta-lactam antibiotics
      term:
        id: CHEBI:27933
        label: beta-lactam antibiotic
      binding: EXACT
    quote: >-
      A history of severe hypersensitivity reactions (e.g., anaphylaxis or Stevens-Johnson
      syndrome) to amoxicillin or other beta-lactam antibiotics (e.g., penicillins and
      cephalosporins) is a contraindication.
    status: DRAFT
    notes: >-
      Cross-sensitivity to beta-lactams other than the product's own amoxicillin; amoxicillin
      itself is not a specialization (own ingredient). Penicillins and cephalosporins are the
      label's examples of the class and are not listed separately. drug allergy is NARROWER than
      "hypersensitivity reactions", justified by "to amoxicillin or other beta-lactam
      antibiotics". Not attributed: the agents are allergens, and the sentence has no ingredient
      subject.
  - relation: CONTRAINDICATED
    section: CONTRAINDICATIONS
    object:
      text: hypersensitivity
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: erythromycin
      term:
        id: CHEBI:42355
        label: erythromycin A
      binding: EXACT
    - text: macrolide antibiotics
      term:
        id: CHEBI:25105
        label: macrolide antibiotic
      binding: EXACT
    quote: >-
      Clarithromycin is contraindicated in patients with a known hypersensitivity to
      clarithromycin, erythromycin, or any of the macrolide antibiotics.
    attributed_to:
    - ingredient: CHEBI:3732
      basis: INGREDIENT_SUBJECT
    status: DRAFT
    notes: >-
      Co-packaged label: this sentence is the clarithromycin tablets' own contraindication, with
      clarithromycin as its subject, so it is attributed to clarithromycin (INGREDIENT_SUBJECT),
      not to the allergen. Clarithromycin as an allergen is the product's own and is not a
      specialization; erythromycin and the macrolide class are the cross-sensitivities.
      Erythromycin is bound to erythromycin A, the compound MeDIC's drug grounding uses for the
      drug erythromycin (ChEBI's "erythromycin" CHEBI:48923 is the family of erythromycins).
