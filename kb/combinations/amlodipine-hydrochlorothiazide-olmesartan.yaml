    url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=49ec5ac8-a626-4ab2-9799-8a138920201e
  product_name: olmesartan medoxomil / amlodipine besylate / hydrochlorothiazide
  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: hypertension
      term:
        id: HP:0000822
        label: Hypertension
      binding: EXACT
    quote: >-
      Olmesartan medoxomil, amlodipine and hydrochlorothiazide tablets are indicated for the
      treatment of hypertension, alone or with other antihypertensive agents, to lower blood
      pressure.
    status: DRAFT
    notes: >-
      Product-level, unattributed. "alone or with other antihypertensive agents" makes co-therapy
      optional, so no in_combination_with. The Limitations of Use ("not indicated for the initial
      therapy of hypertension") restricts this claim but produces none; it is not recorded as
      line_of_therapy because it cannot be quoted. HP Hypertension agrees with the grounding
      store; MONDO has no term labelled or exactly synonymous with "hypertension".
  - relation: CONTRAINDICATED
    section: CONTRAINDICATIONS
    object:
      text: anuria
      term:
        id: HP:0100519
        label: Anuria
      binding: EXACT
    quote: >-
      Because of the hydrochlorothiazide component, olmesartan medoxomil, amlodipine and
      hydrochlorothiazide tablets is contraindicated in patients with anuria, hypersensitivity to
      any component, or hypersensitivity to other sulfonamide-derived drugs.
    attributed_to:
    - ingredient: CHEBI:5778
      basis: COMPONENT_STATEMENT
    status: DRAFT
    notes: >-
      "Because of the hydrochlorothiazide component" opens the sentence and governs every item in
      it, so the anuria contraindication is attributed to hydrochlorothiazide.
  - relation: CONTRAINDICATED
    section: CONTRAINDICATIONS
    object:
      text: hypersensitivity
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: other sulfonamide-derived drugs
      term:
        id: CHEBI:35358
        label: sulfonamide
      binding: BROADER
    quote: >-
      Because of the hydrochlorothiazide component, olmesartan medoxomil, amlodipine and
      hydrochlorothiazide tablets is contraindicated in patients with anuria, hypersensitivity to
      any component, or hypersensitivity to other sulfonamide-derived drugs.
    attributed_to:
    - ingredient: CHEBI:5778
      basis: COMPONENT_STATEMENT
    status: DRAFT
    notes: >-
      Cross-sensitivity to other sulfonamide-derived drugs; "hypersensitivity to any component"
      (the product's own) is not curated. Attributed to hydrochlorothiazide on the label's
      "Because of the hydrochlorothiazide component", not on the allergen (sulfonamides are
      other drugs). ChEBI sulfonamide is the chemical class, broader than "sulfonamide-derived
      drugs".
notes: >-
  Not claimed: the class-level cardiovascular-outcomes text after the indication (the label says
  there are no controlled trials demonstrating risk reduction with this product); Limitations of
  Use (not for initial therapy); "Do not coadminister aliskiren ... in patients with diabetes", a
  drug-interaction contraindication conditional on co-administration with aliskiren, left for a
  human to decide how to record; "hypersensitivity to any component" (own ingredients). The
  Highlights copy ("Anuria: Hypersensitivity to sulfonamide-derived drugs ( 4 )") restates the
  full-text contraindications without the component wording.
