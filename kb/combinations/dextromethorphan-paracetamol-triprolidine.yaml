notes: >-
  OTC Drug Facts label; the Uses text is the indication section and "Do not use" the Contraindications
  section. Uses is an OTC symptom list (in the SPL a nested bullet list under "temporarily relieves
  these common cold and flu symptoms:"): one AMELIORATES_CONDITION claim per symptom per named condition
  (common cold, flu). The last item, "itchy, watery eyes due to hay fever", names hay fever as its
  own condition and carries that context only. "temporarily reduces fever" and "controls cough to
  help you get to sleep" are separate Uses bullets naming no condition, so they carry no context.
  No use is assigned to an ingredient by the label, so no claim is attributed. Both "Do not use" items
  are drug interactions with no condition, so no contraindication is curated: "with any other drug
  containing acetaminophen" and "if you are now taking a prescription monoamine oxidase inhibitor
  (MAOI)" (the parenthesis "certain drugs for depression, psychiatric, or emotional conditions, or
  Parkinson's disease" describes what MAOIs are for, not a patient condition).
