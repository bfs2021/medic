  claims:
  - relation: AMELIORATES_CONDITION
    section: INDICATIONS
    object:
      text: common cold
      term:
        id: MONDO:0005709
        label: common cold
      binding: EXACT
    quote: >-
      temporarily relieves these common cold and flu symptoms: cough minor aches and pains sore
      throat headache runny nose sneezing itching of the nose or throat itchy, watery eyes due to
      hay fever
    status: DRAFT
    notes: >-
      "relieves these common cold and flu symptoms: ..." is symptomatic treatment of the
      conditions, so the condition is the object; the listed symptoms (cough, minor aches and
      pains, sore throat, headache, runny nose, sneezing, itching of the nose or throat) stay in
      the quote and are not separate claims. Product-level OTC Uses text, unattributed.
  - relation: AMELIORATES_CONDITION
    section: INDICATIONS
    object:
      text: flu
      term:
        id: MONDO:0005812
        label: influenza
      binding: EXACT
    quote: >-
      temporarily relieves these common cold and flu symptoms: cough minor aches and pains sore
      throat headache runny nose sneezing itching of the nose or throat itchy, watery eyes due to
      hay fever
    status: DRAFT
  - relation: AMELIORATES_CONDITION
    section: INDICATIONS
    object:
      text: hay fever
      term:
        id: MONDO:0005324
        label: seasonal allergic rhinitis
      binding: EXACT
    quote: >-
      temporarily relieves these common cold and flu symptoms: cough minor aches and pains sore
      throat headache runny nose sneezing itching of the nose or throat itchy, watery eyes due to
      hay fever
    status: DRAFT
    notes: >-
      The flattened Uses list makes the scope of "due to hay fever" ambiguous: in the usual OTC
      layout it qualifies the antihistamine symptoms (runny nose, sneezing, itching of the nose or
      throat, itchy watery eyes); here it can only be shown to attach to "itchy, watery eyes".
      Either way the claim is relief of hay fever symptoms.
  - relation: AMELIORATES_CONDITION
    section: INDICATIONS
    object:
      text: fever
      term:
        id: HP:0001945
        label: Fever
      binding: EXACT
    quote: >-
      temporarily reduces fever
    status: DRAFT
    notes: Temporary symptomatic reduction, so AMELIORATES_CONDITION rather than TREATS.
  - relation: AMELIORATES_CONDITION
    section: INDICATIONS
    object:
      text: cough
      term:
        id: HP:0012735
        label: Cough
      binding: EXACT
    quote: >-
      controls cough to help you get to sleep
    status: DRAFT
    notes: >-
      Cough control at night, stated on its own line apart from the cold/flu symptom list.
notes: >-
  OTC Drug Facts label; the Uses text is the indication section and "Do not use" the
  Contraindications section. Both "Do not use" items are drug interactions with no condition, so
  no contraindication is curated: "with any other drug containing acetaminophen" (duplicate
  acetaminophen) and "if you are now taking a prescription monoamine oxidase inhibitor (MAOI)"
  (the parenthesis "certain drugs for depression, psychiatric, or emotional conditions, or
  Parkinson's disease" describes what MAOIs are for, not a patient condition the product is
  contraindicated in). The symptom list after "these common cold and flu symptoms:" is a colon
  list of the symptoms relieved, not an "e.g."/"including" examples list. No use is assigned to
  an ingredient by the label.
