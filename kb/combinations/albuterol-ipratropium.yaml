  document:
    setid: 001e3b1c-b7c1-44aa-b812-e78dbf4f3069
    version: 2
    title: Ipratropium Bromide and Albuterol Sulfate
    url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=001e3b1c-b7c1-44aa-b812-e78dbf4f3069
  product_name: Ipratropium Bromide and Albuterol Sulfate
  claims:
  - relation: TREATS
    section: INDICATIONS
    object:
      text: bronchospasm
      term:
        id: HP:4000007
        label: Bronchoconstriction
      binding: EXACT
    quote: >-
      Ipratropium Bromide and Albuterol Sulfate Inhalation Solution is indicated for the treatment
      of bronchospasm associated with COPD in patients requiring more than one bronchodilator.
    disease_context:
      text: COPD
      term:
        id: MONDO:0005002
        label: chronic obstructive pulmonary disease
      binding: EXACT
    status: DRAFT
    notes: >-
      Bronchospasm is a phenotype: HP Bronchoconstriction (exact synonym "Bronchospasm"). The
      grounding store maps "bronchospasm" to MONDO:0001358 bronchial disorder, which is broader and
      loses the phenotype. "in patients requiring more than one bronchodilator" is a population /
      severity criterion, not a prior-therapy failure, so no line_of_therapy. Product-level claim,
      unattributed.
  - relation: CONTRAINDICATED
    section: CONTRAINDICATIONS
    object:
      text: hypersensitivity
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: atropine
      term:
        id: CHEBI:16684
        label: atropine
      binding: EXACT
    - text: its derivatives
      term_gap: >-
        searched CHEBI "atropine", "tropane", "muscarinic antagonist": no class for atropine
        derivatives (tropane alkaloid and muscarinic antagonist are both broader and differ in
        meaning)
    quote: >-
      Ipratropium Bromide and Albuterol Sulfate Inhalation Solution is contraindicated in patients
      with a history of hypersensitivity to any of its components, or to atropine and its
      derivatives.
    status: DRAFT
    notes: >-
      Only the cross-sensitivity to atropine and its derivatives is curated; "any of its
      components" is allergy to the product's own ingredients and is not. drug allergy is
      NARROWER than the bare word "hypersensitivity" (MONDO:0000605), justified by "to atropine
      and its derivatives". Unattributed: atropine is the allergen, and the label does not name
      ipratropium (an atropine derivative pharmacologically).
