notes: >-
  OTC label: the helper prints the Drug Facts "Uses" as Indications and "Do not use" as
  Contraindications. Neither "Do not use" item is curated: "with any drug containing acetaminophen"
  and "if you are now taking a prescription monoamine oxidase inhibitor (MAOI) ... or for 2 weeks
  after stopping the MAOI drug" are drug-drug interactions with no patient condition (the
  parenthesis "certain drugs for depression, psychiatric or emotional conditions, or Parkinson's
  disease" describes what MAOIs are used for, not a condition that contraindicates the product).
  The Drug Facts "Ask a doctor before use" warnings are not a contraindications section. Not
  curated as claims from Uses: the listed symptoms and the mechanism phrases ("reduces swelling of
  nasal passages", "helps loosen phlegm (mucus)").
