notes: >-
  Two CADUET labels: 6f1a9bd8 v52 (current PLR format) and 909fad96 v1 (older format, empty SPL
  title). Not claimed: "indicated in patients for whom treatment with both amlodipine and
  atorvastatin is appropriate" (a population); class-level antihypertensive outcome text;
  revascularization procedures (procedures); hypersensitivity to amlodipine, atorvastatin, the
  excipients or "any component" (own ingredients); the hypersensitivity-reaction list (describes
  reactions). In v1: the "Prevention of Cardiovascular Disease" heading (the items under it are
  curated); the lipid-therapy preamble; "has not been studied in conditions where ... elevation of
  chylomicrons" (negated); "SHOULD BE ADMINISTERED TO WOMEN OF CHILDBEARING AGE ONLY WHEN ..."
  (restates the may-become-pregnant contraindication as usage advice); the pregnancy background
  sentences (cholesterol in pregnancy, animal and case-report data). The pregnancy, may-become-pregnant
  and breastfeeding contraindications are curated unbound.
