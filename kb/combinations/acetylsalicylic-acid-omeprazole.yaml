  claims:
  - relation: PREVENTATIVE_FOR_CONDITION
    section: INDICATIONS
    object:
      text: nonfatal stroke
      term:
        id: MONDO:0005098
        label: stroke disorder
      binding: EXACT
    quote: >-
        The aspirin component of ASPIRIN AND OMEPRAZOLE DELAYED-RELEASE TABLETSA is indicated for:
        reducing the combined risk of death and nonfatal stroke in patients who have had ischemic
        stroke or transient ischemia of the brain due to fibrin platelet emboli
    attributed_to:
    - ingredient: CHEBI:15365
      basis: COMPONENT_STATEMENT
    disease_context:
      text: ischemic stroke
      term:
        id: MONDO:1060198
        label: ischemic stroke
      binding: EXACT
    status: DRAFT
    notes: >-
      Secondary prevention. "death" in the combined endpoint is an outcome, not a condition. The
      transient-ischemia context is a separate claim.
  - relation: PREVENTATIVE_FOR_CONDITION
