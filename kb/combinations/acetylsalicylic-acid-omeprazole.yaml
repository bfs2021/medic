  - relation: PREVENTATIVE_FOR_CONDITION
    section: INDICATIONS
    object:
      text: aspirin-associated gastric ulcers
      term:
        id: MONDO:0001126
        label: gastric ulcer
      binding: BROADER
    object_specialization:
    - text: aspirin
      term:
        id: CHEBI:15365
        label: acetylsalicylic acid
      binding: EXACT
    quote: >-
      The omeprazole component of ASPIRIN AND OMEPRAZOLE DELAYED-RELEASE TABLETSA is indicated for
      decreasing the risk of developing aspirin-associated gastric ulcers in patients at risk for
      developing aspirin-associated gastric ulcers due to age (≥ 55) or documented history of
      gastric ulcers.
    attributed_to:
    - ingredient: CHEBI:7772
      basis: COMPONENT_STATEMENT
    status: DRAFT
    notes: >-
      gastric ulcer + specialization aspirin composes "aspirin-associated gastric ulcer"; no
      drug-induced or aspirin-induced gastric ulcer term (searched MONDO "gastric ulcer",
      "peptic ulcer", "aspirin"; HP "gastric ulcer"). "age (≥ 55) or documented history of gastric
      ulcers" are alternative risk criteria, so no age_range is recorded.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: allergy
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: nonsteroidal anti-inflammatory drug products (NSAIDs)
      term:
        id: CHEBI:35475
        label: non-steroidal anti-inflammatory drug
      binding: EXACT
    quote: >-
      Patients with known allergy to aspirin and other nonsteroidal anti-inflammatory drug products
      (NSAIDs)
    status: DRAFT
    notes: >-
      Cross-sensitivity to NSAIDs other than the product's own aspirin. Not attributed: aspirin is
      the allergen, not a cause. drug allergy is NARROWER than the bare word "allergy", justified
      by "to aspirin and other ... NSAIDs" in the quote. The Highlights item "History of asthma,
      urticaria, or other allergic-type reactions after taking aspirin or other NSAIDs" restates
      this contraindication and is not a separate claim.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: the syndrome of asthma, rhinitis, and nasal polyps
      term:
        id: MONDO:0008834
        label: asthma, nasal polyps, and aspirin intolerance
      binding: NARROWER
    quote: >-
      in patients with the syndrome of asthma, rhinitis, and nasal polyps.
    status: DRAFT
    notes: >-
      One claim for the named syndrome (Samter's triad / aspirin-exacerbated respiratory
      disease), not split into its parts. MONDO:0008834 (OMIM:208550) names the triad; NARROWER
      because it adds aspirin intolerance, which this clause does not state. It sits under
      hereditary disease; the alternative MONDO:0850287 aspirin-induced respiratory disease is
      an intrinsic-asthma term that covers neither rhinitis nor nasal polyps. Unattributed: the
      next sentence ("Aspirin may cause severe urticaria, angioedema, or bronchospasm (asthma).")
      points at aspirin but is not linked to this clause by any causal wording, and it explains
      the NSAID-allergy item equally.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: suspected viral infections
      term:
        id: MONDO:0005108
        label: viral infectious disease
      binding: EXACT
    life_stage:
      text: Pediatric patients
      term:
        id: HsapDv:0000264
        label: pediatric stage
      binding: EXACT
    quote: >-
      Pediatric patients with suspected viral infections, with or without fever, because of the
      risk of Reye's syndrome with concomitant use of aspirin in certain viral illnesses.
    attributed_to:
    - ingredient: CHEBI:15365
      basis: STATED_REASON
    status: DRAFT
    notes: >-
      The label names aspirin as the cause ("because of the risk of Reye's syndrome with
      concomitant use of aspirin"). Reye's syndrome is the risk avoided, not the contraindicated
      condition, so no claim for it. "suspected" is kept in the text; the term is bound EXACT to
      the condition itself.
  - relation: CONTRAINDICATED_IN
    section: CONTRAINDICATIONS
    object:
      text: hypersensitivity
      term:
        id: MONDO:0000775
        label: drug allergy
      binding: NARROWER
    object_specialization:
    - text: substituted benzimidazoles
      term:
        id: CHEBI:22715
        label: benzimidazoles
      binding: BROADER
    quote: >-
      ASPIRIN AND OMEPRAZOLE DELAYED-RELEASE TABLETSA is contraindicated in patients with known
      hypersensitivity to aspirin, omeprazole, substituted benzimidazoles
    status: DRAFT
    notes: >-
      Cross-sensitivity to the substituted benzimidazoles (the proton pump inhibitor class
      omeprazole belongs to). BROADER: ChEBI's benzimidazoles class also contains unsubstituted
      benzimidazole, which the label does not name. The same sentence also names aspirin, omeprazole and the
      excipients; allergy to the product's own ingredients is not curated, so only the class is
      a specialization. Not attributed: the agents are allergens, not causes.
notes: >-
  Not claimed: the product-level sentence ("patients who require aspirin for secondary prevention
  of cardiovascular and cerebrovascular events and who are at risk of developing aspirin
  associated gastric ulcers") describes a population; the revascularization item (CABG/PTCA) is a
  procedure; Limitations of Use (acute coronary syndrome, acute myocardial infarction, PCI; "has
  not been shown to reduce the risk of gastrointestinal bleeding") produce no claims; the
  rilpivirine contraindication is a drug interaction with no condition; in "known
  hypersensitivity to aspirin, omeprazole, substituted benzimidazoles, or to any of the
  excipients" only the benzimidazole cross-sensitivity is curated (aspirin, omeprazole and the
  excipients are the product's own). The Highlights copies restate the full-text claims.
