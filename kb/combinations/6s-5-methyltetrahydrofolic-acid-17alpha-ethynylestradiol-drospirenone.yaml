    status: DRAFT
    notes: >-
      MONDO's hypertensive disorder has no "hypertension" synonym, so HP Hypertension; "uncontrolled" narrows, so BROADER. Grounding store maps "Uncontrolled hypertension" to UMLS:C1868885.
  - relation: CONTRAINDICATED
