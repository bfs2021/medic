notes: >-
  Not curated: "indicated for use by women to prevent pregnancy" (contraception; pregnancy is not a
  condition and has no MONDO/HP/PATO term: searched MONDO "pregnancy", HP "Pregnancy", PATO
  "pregnant"); the Pregnancy contraindication, for the same reason; "Smoke, if over age 35" (a
  behaviour); co-administration with ombitasvir/paritaprevir/ritonavir (drug interaction, no
  condition). The Highlights copy of the contraindications restates the full-text list. The DSM-IV
  description of PMDD and its feature list are background, not claims.
