    status: DRAFT
    notes: >-
      No MONDO deep-vein-thrombosis term (searched MONDO "deep vein thrombosis", "venous thrombosis", "vein thrombosis"); HP Deep venous thrombosis has the exact synonym.
  - relation: CONTRAINDICATED
