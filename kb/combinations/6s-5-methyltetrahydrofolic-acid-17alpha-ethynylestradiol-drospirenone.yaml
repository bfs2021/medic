  product_name: DROSPIRENONE, ETHINYL ESTRADIOL AND LEVOMEFOLATE CALCIUM AND LEVOMEFOLATE CALCIUM
  claims:
  - relation: RELIEVES_SYMPTOMS
    section: INDICATIONS
    object:
      text: premenstrual dysphoric disorder
      term:
        id: MONDO:1010182
        label: premenstrual dysphoric disorder
      binding: EXACT
    quote: >-
      Drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium
      tablets are also indicated for the treatment of symptoms of premenstrual dysphoric disorder
      (PMDD) in women who choose to use an oral contraceptive as their method of contraception.
    sex:
      text: women
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    status: DRAFT
    notes: >-
      "treatment of symptoms of" -> RELIEVES_SYMPTOMS. "who choose to use an oral contraceptive as
      their method of contraception" is a population criterion, not a co-therapy. Effectiveness
      beyond three cycles not evaluated and PMS not evaluated (negated, no claim). Product-level.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: moderate acne vulgaris
      term:
        id: MONDO:0011438
        label: acne
      binding: BROADER
    quote: >-
      Drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium
      tablets are indicated for the treatment of moderate acne vulgaris in women at least 14 years of
      age, who have no known contraindications to oral contraceptive therapy and have achieved
      menarche.
    sex:
      text: women
      term:
        id: PATO:0000383
        label: female
      binding: EXACT
    age_range:
      min_years: 14
      text: at least 14 years of age
    status: DRAFT
    notes: >-
      "acne vulgaris" is an exact synonym of MONDO acne; "moderate" narrows, so BROADER. "have
      achieved menarche" is a further life-stage criterion with no HsapDv term (not recorded as
      life_stage). Use only when the patient desires an oral contraceptive (next sentence).
  - relation: PREVENTS
    section: INDICATIONS
    object:
      text: neural tube defect
      term:
        id: MONDO:0018075
        label: neural tube defect
      binding: EXACT
    quote: >-
      Drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium
      tablets are indicated in women who choose to use an oral contraceptive as their method of
      contraception, to raise folate levels for the purpose of reducing the risk of a neural tube
      defect in a pregnancy conceived while taking the product or shortly after discontinuing the
      product.
    status: DRAFT
    notes: >-
      No sex qualifier: "women" are the people taking the product, while the defect occurs in the
      conceptus. Neural tube defect in a pregnancy conceived on or shortly after the product. The folate
      supplementation points to the levomefolate component pharmacologically, but the label states
      it of the product, so unattributed. Grounding store maps "Neural tube defect" to HP:0045005;
      MONDO chosen for the disease.
  - relation: CONTRAINDICATED
    section: CONTRAINDICATIONS
    object:
      text: Renal impairment
      term:
        id: HP:0000083
        label: Renal insufficiency
      binding: EXACT
    quote: >-
      Do not prescribe drospirenone, ethinyl estradiol and levomefolate calcium tablets and
      levomefolate calcium tablets to women who are known to have the following: Renal impairment
      Adrenal insufficiency A high risk of arterial or venous thrombotic diseases.
    status: DRAFT
    notes: >-
      HP Renal insufficiency (exact synonym Renal failure) is the closest term for impaired renal function; MONDO kidney failure is equivalent. Grounding store maps "Renal impairment" to UMLS:C1565489 Renal Insufficiencies.
  - relation: CONTRAINDICATED
    section: CONTRAINDICATIONS
    object:
      text: Adrenal insufficiency
      term:
        id: MONDO:0000004
        label: adrenocortical insufficiency
      binding: EXACT
    quote: >-
      Do not prescribe drospirenone, ethinyl estradiol and levomefolate calcium tablets and
      levomefolate calcium tablets to women who are known to have the following: Renal impairment
      Adrenal insufficiency A high risk of arterial or venous thrombotic diseases.
    status: DRAFT
  - relation: CONTRAINDICATED
    section: CONTRAINDICATIONS
    object:
      text: arterial or venous thrombotic diseases
      term:
        id: MONDO:0000831
        label: thrombotic disease
      binding: EXACT
    quote: >-
      Do not prescribe drospirenone, ethinyl estradiol and levomefolate calcium tablets and
      levomefolate calcium tablets to women who are known to have the following: Renal impairment
      Adrenal insufficiency A high risk of arterial or venous thrombotic diseases.
    status: DRAFT
    notes: >-
      The label contraindicates a high risk of thrombotic disease, not only established disease; the term binds the disease the risk concerns; the examples that follow in the label are curated as their own claims where they name a condition. "Smoke, if over age 35" is a behaviour, not a condition, and is not curated.
  - relation: CONTRAINDICATED
