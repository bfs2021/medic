    status: DRAFT
    notes: >-
      The label contraindicates a high risk of thrombotic disease and then lists examples ("Examples
      include women who are known to: ..."), so this is one claim with the listed conditions as
      `examples` (formerly one claim each). The term binds the disease the risk concerns. The
      nested "(for example, subacute bacterial endocarditis ..., or atrial fibrillation)" members
      are flattened into the same list. "Smoke, if over age 35" is a behaviour and is not an
      example descriptor. Members with a restriction of their own are separate claims below, not
      examples: deep vein thrombosis and pulmonary embolism ("now or in the past") and migraine
      ("if over age 35"). Example terms: "thrombogenic valvular ... diseases of the heart" is the contiguous part
      of the coordination, heart valve disorder BROADER; no thrombogenic-arrhythmia term, cardiac
      rhythm disease BROADER; "with valvular disease" narrows SBE, BROADER; thrombophilia (exact
      synonym hypercoagulability), "inherited or acquired" covers both, EXACT; MONDO hypertensive
      disorder has no "hypertension" synonym, so HP Hypertension, "uncontrolled" narrows, BROADER;
      MONDO:0000960 diabetic peripheral angiopathy is peripheral-only, so diabetes mellitus
      BROADER; no headache-with-focal-neurological-symptoms term (searched HP "Headache", "focal",
      "Focal neurological deficit"), Headache BROADER. "if over age 35" in the same list item
      attaches to the migraine member only ("or have migraine headaches ... if over age 35").
