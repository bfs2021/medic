    status: DRAFT
    notes: >-
      MONDO:0000960 diabetic peripheral angiopathy (exact synonym diabetic vascular disorder) is restricted to peripheral vessels and sits under peripheral vascular disease, not diabetes mellitus; diabetes mellitus BROADER is the accurate binding.
  - relation: CONTRAINDICATED
