notes: >-
  Not curated: "known hypersensitivity to any of the ingredients" (allergy to the product's own
  ingredients). The Indications are the DESI "possibly" effective list; the capitalised sentence on
  duodenal-ulcer healing is negated. "especially if complicated by toxic megacolon" is folded into the
  ulcerative-colitis claim. The SPL lists hyoscyamine, which the pipeline grounds as (S)-atropine.
