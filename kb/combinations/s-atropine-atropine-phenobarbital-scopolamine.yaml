      term:
        id: MONDO:0009172
        label: enterocolitis
      binding: BROADER
    quote: >-
      For use as adjunctive therapy in the treatment of irritable bowel syndrome (irritable colon,
      spastic colon, mucous colitis) and acute enterocolitis.
    status: DRAFT
    notes: >-
      DESI "possibly" effective. No acute-enterocolitis term (searched MONDO/HP "enterocolitis");
      "acute" narrows the condition, so BROADER. Note MONDO:0009172 sits under hereditary disease in MONDO;
      HP:0004387 Enterocolitis is the alternative if that placement is a concern. Grounding store
      maps "acute enterocolitis" to UMLS:C3203466.
  - relation: TREATS
    section: INDICATIONS
    object:
      text: duodenal ulcer
      term:
        id: MONDO:0005412
        label: duodenal ulcer
      binding: EXACT
    quote: >-
      May also be useful as adjunctive therapy in the treatment of duodenal ulcer.
    status: DRAFT
    notes: >-
      Hedged ("May also be useful") within the DESI "possibly" effective list. The following
      sentence (anticholinergic/antispasmodic drugs not shown conclusively to aid healing, reduce
      recurrence or prevent complications) is negated and produces no claim. A reviewer may prefer
      to reject this claim as too weak to count as an indication.
