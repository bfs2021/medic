        label: irritable bowel syndrome
      binding: EXACT
    quote: >-
      For use as adjunctive therapy in the treatment of irritable bowel syndrome (irritable colon,
      spastic colon, mucous colitis) and acute enterocolitis.
    status: DRAFT
    notes: >-
      FDA (DESI) classified this indication as "possibly" effective; the claim records what the
      label states. "adjunctive therapy" names no co-therapy, so no in_combination_with. The
      parenthetical (irritable colon, spastic colon, mucous colitis) lists synonyms of IBS, not
      separate conditions. Product-level claim, unattributed.
