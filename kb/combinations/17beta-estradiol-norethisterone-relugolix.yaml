notes: >-
  Not curated: the pregnancy contraindication ("Who are pregnant"; no MONDO/HP/PATO term for
  pregnancy); "women over 35 years of age who smoke" (a behaviour); "known anaphylactic reaction,
  angioedema, or hypersensitivity to MYFEMBREE or any of its components" (allergy to the product
  itself); the Limitations of Use (24-month limit for bone loss). The Highlights restate the
  full-text indications and contraindications. The full-text "1.3 Limitations of Use" paragraph is
  printed by the helper as SECTION_TEXT, not LIMITATION_STATEMENT; it produces no claim either way.
