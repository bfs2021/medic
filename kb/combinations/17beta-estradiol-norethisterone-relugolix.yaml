      thrombogenic rhythm diseases of the heart (e.g., subacute bacterial endocarditis with valvular
      disease, or atrial fibrillation) inherited or acquired hypercoagulopathies uncontrolled
      hypertension headaches with focal neurological symptoms or migraine headaches with aura if
      over 35 years of age
