    quote: >-
      MYFEMBREE is contraindicated in women: With a high risk of arterial, venous thrombotic, or
      thromboembolic disorders [see Boxed Warning and Warnings and Precautions ( 5.1 )] . Examples
      include women over 35 years of age who smoke and women who are known to have: current or
      history of deep vein thrombosis or pulmonary embolism vascular disease (e.g., cerebrovascular
