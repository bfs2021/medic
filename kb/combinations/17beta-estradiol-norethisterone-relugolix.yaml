    status: DRAFT
    notes: >-
      The label contraindicates a high risk of thrombotic or thromboembolic disease and then lists
      examples ("Examples include ... women who are known to have: ..."), so this is one claim with
      the listed conditions as `examples` (formerly one claim each). The term binds the disease the
      risk concerns. The nested "(e.g., ...)" members of vascular disease and of the thrombogenic
      heart diseases are flattened into the same list. "women over 35 years of age who smoke" is a
      behaviour and is not an example descriptor. Members with a restriction of their own are
      separate claims below, not examples: deep vein thrombosis and pulmonary embolism ("current or
      history of") and migraine with aura ("if over 35 years of age"). Example terms: "thrombogenic valvular ... diseases of the heart" is
      the contiguous part of the coordination, heart valve disorder BROADER; no
      thrombogenic-arrhythmia term, cardiac rhythm disease BROADER; "with valvular disease" narrows
      SBE, BROADER; thrombophilia EXACT for "inherited or acquired"; MONDO hypertensive disorder has
      no "hypertension" synonym, so HP Hypertension, "uncontrolled" narrows, BROADER; no
      headache-with-focal-neurological-symptoms term, Headache BROADER. The label's "headaches with
      focal neurological symptoms or migraine headaches with aura if over 35 years of age" is
      ambiguous; read, as in the standard oral-contraceptive wording, with the age bound on the
      migraine member only, so the headaches member stays an example. A reviewer who reads the
      bound as covering both should split the headaches member out the same way.
