        label: female
      binding: EXACT
    status: DRAFT
    notes: >-
      "management of" -> TREATS. HP Menorrhagia (exact synonym "Abnormally heavy bleeding during
      menstruation"); no MONDO term (searched MONDO "menorrhagia", "heavy menstrual bleeding").
      Context: HP Uterine leiomyoma (exact synonym Uterine fibroid); MONDO:0007886 uterine corpus
