    status: DRAFT
    notes: >-
      A listed example of the high risk of arterial, venous thrombotic, or thromboembolic
      disorders ("Examples include ... women who are known to have: ..."), separated from that
      claim's examples because the label restricts it: "current or history of", i.e. current deep
      vein thrombosis or a history of it. No slot records a temporal scope, so the object alone
      reads as current disease; the label also contraindicates a past episode. No MONDO DVT term
      (searched MONDO "deep vein thrombosis", "venous thrombosis"), so HP.
