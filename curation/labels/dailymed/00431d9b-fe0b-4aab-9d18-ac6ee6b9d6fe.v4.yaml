title: 'These highlights do not include all the information needed to use BUTALBITAL, ACETAMINOPHEN, CAFFEINE,
  and CODEINE PHOSPHATE CAPSULES safely and effectively. See full prescribing information for BUTALBITAL,
  ACETAMINOPHEN, CAFFEINE, and CODEINE PHOSPHATE CAPSULES. BUTALBITAL, ACETAMINOPHEN, CAFFEINE, and CODEINE
  PHOSPHATE capsules for oral use, CIIIInitial U.S. Approval: 1992'
product_name: Butalbital, Acetaminophen, Caffeine, and Codeine Phosphate
active_moieties:
- ACETAMINOPHEN
- BUTALBITAL
- CAFFEINE
- CODEINE ANHYDROUS
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'Butalbital, Acetaminophen, Caffeine, and Codeine Phosphate Capsules are indicated for the management
    of the symptom complex of tension (or muscle contraction) headache when non-opioid analgesic and alternative
    treatments are inadequate. Limitations of Use Because of the risks of addiction, abuse, and misuse
    with opioids and butalbital, even at recommended doses [see Warnings and Precautions (5.1) ], reserve
    Butalbital, Acetaminophen, Caffeine, and Codeine Phosphate Capsules for use in patients for whom alternative
    treatment options [e.g., non-opioid, non-barbiturate analgesics]: Have not been tolerated, or are
    not expected to be tolerated, Have not provided adequate analgesia, or are not expected to provide
    adequate analgesia.'
  - 'Butalbital, Acetaminophen, Caffeine, and Codeine Phosphate Capsule is a combination product of butalbital,
    a barbiturate; acetaminophen; caffeine, a methylxanthine; and codeine phosphate, an opioid agonist;
    and is indicated for the management of the symptom complex of tension (or muscle contraction) headache,
    when other non-opioid analgesic and alternative treatments are inadequate. Limitations of Use Because
    of the risks of addiction, abuse, and misuse with opioids, even at recommended doses, reserve Butalbital,
    Acetaminophen, Caffeine, and Codeine Phosphate Capsules for use in patients for whom alternative treatment
    options (e.g., non-opioid, non-barbiturate analgesics): Have not been tolerated, or are not expected
    to be tolerated, Have not provided adequate analgesia, or are not expected to provide adequate analgesia.'
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Butalbital, Acetaminophen, Caffeine, and Codeine Phosphate Capsules are contraindicated for: All
    children younger than 12 years of age [see Warnings and Precautions (5.5) ]. Post-operative management
    in children younger than 18 years of age following tonsillectomy and/or adenoidectomy [see Warnings
    and Precautions (5.5) ] Butalbital, Acetaminophen, Caffeine, and Codeine Phosphate Capsules are also
    contraindicated in patients with: Significant respiratory depression [see Warnings and Precautions
    (5.3) ] Acute or severe bronchial asthma in an unmonitored setting or in the absence of resuscitative
    equipment [see Warnings and Precautions (5.9) ] Concurrent use of monoamine oxidase inhibitors (MAOIs)
    or use of MAOIs within the last 14 days [see Warnings and Precautions (5.10), Drug Interactions (7)
    ] Known or suspected gastrointestinal obstruction, including paralytic ileus [see Warnings and Precautions
    (5.14) ] Known intolerance or hypersensitivity to acetaminophen, caffeine, butalbital, or codeine
    or to the components of Butalbital, Acetaminophen, Caffeine, and Codeine Phosphate Capsules Porphyria'
  - Children younger than 12 years of age. (4) Post-operative management in children younger than 18 years
    of age following tonsillectomy and/or adenoidectomy. (4) Significant respiratory depression. (4) Acute
    or severe bronchial asthma in an unmonitored setting or in absence of resuscitative equipment. (4)
    Concurrent use of monoamine oxidase inhibitors (MAOIs) or use of MAOIs within the last 14 days. (4)
    Known or suspected gastrointestinal obstruction, including paralytic ileus. (4) Intolerance or hypersensitivity
    to acetaminophen, caffeine, butalbital or codeine, or components of Butalbital, Acetaminophen, Caffeine,
    and Codeine Phosphate Capsules. (4) Porphyria. (4)
