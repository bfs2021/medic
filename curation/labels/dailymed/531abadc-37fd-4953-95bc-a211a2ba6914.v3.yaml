title: Advil Sinus Congestion & Pain Relief
product_name: Advil Sinus Congestion and Pain Relief
active_moieties:
- IBUPROFEN
- PHENYLEPHRINE
sections:
  INDICATIONS:
  - Uses
  - '• temporarily relieves these symptoms associated with the common cold or flu: • headache • fever
    • sinus pressure • nasal congestion • minor body aches and pains • reduces swelling of the nasal passages
    • temporarily restores freer breathing through the nose'
  CONTRAINDICATIONS:
  - Do not use
  - • in children under 12 years of age because this product contains too much medication for children
    under this age • if you have ever had an allergic reaction to any other pain reliever/fever reducer
    • right before or after heart surgery • if you are now taking a prescription monoamine oxidase inhibitor
    (MAOI) (certain drugs for depression, psychiatric, or emotional conditions, or Parkinson's disease),
    or for 2 weeks after stopping the MAOI drug. If you do not know if your prescription drug contains
    an MAOI, ask a doctor or pharmacist before taking this product
