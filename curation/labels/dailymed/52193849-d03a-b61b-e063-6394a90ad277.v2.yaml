sections:
  INDICATIONS:
  - Uses
  - 'temporarily relieves minor aches and pains due to: ■ headache ■ toothache ■ backache ■ menstrual
    cramps ■ muscular aches ■ minor pain of arthritis'
  CONTRAINDICATIONS:
  - Do not use
  - with any other drug containing acetaminophen (prescription or nonprescription). If you are not sure
    whether a drug contains acetaminophen, ask a doctor or pharmacist if you have ever had an allergic
    reaction to acetaminophen or any other pain reliever right before or after heart surgery
