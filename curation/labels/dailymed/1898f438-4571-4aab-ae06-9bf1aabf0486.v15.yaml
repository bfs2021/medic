  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - Irbesartan and hydrochlorothiazide tablets are contraindicated in patients who are hypersensitive
    to any component of this product. Because of the hydrochlorothiazide component, this product is contraindicated
    in patients with anuria or hypersensitivity to other sulfonamide-derived drugs. Do not coadminister
    aliskiren with irbesartan and hydrochlorothiazide tablets in patients with diabetes [see Drug Interactions
    ( 7 ) ] .
  - • Hypersensitivity to any component of this product. ( 4 ) • Anuria. ( 4 ) • Hypersensitivity to sulfonamide-derived
    drugs. ( 4 ) • Do not coadminister aliskiren with irbesartan and hydrochlorothiazide tablets in patients
    with diabetes. ( 4 )
