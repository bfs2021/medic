title: 'These highlights do not include all the information needed to use ZYLET safely and effectively.
  See full prescribing information for ZYLET.ZYLET® (loteprednol etabonate and tobramycin ophthalmic suspension)
  0.5%/0.3%, for topical ophthalmic use Initial U.S. Approval: 2004'
product_name: Zylet
active_moieties:
- LOTEPREDNOL
- TOBRAMYCIN
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'ZYLET ® (loteprednol etabonate and tobramycin ophthalmic suspension), 0.5%/0.3% is a topical anti-infective
    and corticosteroid combination for steroid-responsive inflammatory ocular conditions for which a corticosteroid
    is indicated and where superficial bacterial ocular infection or a risk of bacterial ocular infection
    exists. Ocular steroids are indicated in inflammatory conditions of the palpebral and bulbar conjunctiva,
    cornea and anterior segment of the globe such as allergic conjunctivitis, acne rosacea, superficial
    punctate keratitis, herpes zoster keratitis, iritis, cyclitis, and where the inherent risk of steroid
    use in certain infective conjunctivitides is accepted to obtain a diminution in edema and inflammation.
    They are also indicated in chronic anterior uveitis and corneal injury from chemical, radiation or
    thermal burns, or penetration of foreign bodies. The use of a combination drug with an anti-infective
    component is indicated where the risk of superficial ocular infection is high or where there is an
    expectation that potentially dangerous numbers of bacteria will be present in the eye. The particular
    anti-infective drug in this product (tobramycin) is active against the following common bacterial
    eye pathogens: Staphylococci, including S. aureus and S. epidermidis (coagulase-positive and coagulase-negative),
    including penicillin-resistant strains. Streptococci, including some of the Group A-beta-hemolytic
    species, some nonhemolytic species, and some Streptococcus pneumoniae , Pseudomonas aeruginosa, Escherichia
    coli, Klebsiella pneumoniae, Enterobacter aerogenes, Proteus mirabilis, Morganella morganii , most
    Proteus vulgaris strains, Haemophilus influenzae , and H. aegyptius, Moraxella lacunata, Acinetobacter
    calcoaceticus and some Neisseria species.'
  - ZYLET is a combination of loteprednol etabonate, a corticosteroid, and tobramycin, an aminoglycoside
    antibacterial, indicated for steroid-responsive inflammatory ocular conditions for which a corticosteroid
    is indicated and where superficial bacterial ocular infection or a risk of bacterial ocular infection
    exists. ( 1 )
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - ZYLET, as with other steroid anti-infective ophthalmic combination drugs, is contraindicated in most
    viral diseases of the cornea and conjunctiva including epithelial herpes simplex keratitis (dendritic
    keratitis), vaccinia, and varicella, and also in mycobacterial infection of the eye and fungal diseases
    of ocular structures. ( 4.1 )
  - 4.1 Nonbacterial Etiology
  - ZYLET, as with other steroid anti-infective ophthalmic combination drugs, is contraindicated in most
    viral diseases of the cornea and conjunctiva including epithelial herpes simplex keratitis (dendritic
    keratitis), vaccinia, and varicella, and also in mycobacterial infection of the eye and fungal diseases
    of ocular structures.
