sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - Pseudodine™ C Cough Syrup is indicated for temporary relief of coughs and upper respiratory symptoms,
    including nasal congestion, associated with allergy or the common cold.
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - 'Pseudodine™ C Cough Syrup is contraindicated under the following conditions:'
  - Use in Newborn or Premature Infants
  - This drug should not be used in newborn or premature infants.
  - Use in Lower Respiratory Disease
  - Antihistamines should not be used to treat lower respiratory tract symptoms, including asthma.
  - Hypersensitivity to
  - (1) codeine phosphate or other narcotics; (2) triprolidine hydrochloride or other antihistamines of
    similar chemical structure; or (3) sympathomimetic amines, including pseudoephedrine. Sympathomimetic
    amines are contraindicated in patients with severe hypertension, severe coronary artery disease and
    in patients on monoamine oxidase (MAO) inhibitor therapy (see PRECAUTIONS, Drug Interactions ).
