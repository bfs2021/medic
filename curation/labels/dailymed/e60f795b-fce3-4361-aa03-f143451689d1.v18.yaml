  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - Edarbyclor is contraindicated in patients with anuria [see Warnings and Precautions (5.3) ]. Do not
    coadminister aliskiren-containing products with Edarbyclor in patients with diabetes [see Drug Interactions
    (7) ] .
  - Anuria ( 4 ) Do not coadminister aliskiren-containing products with Edarbyclor in patients with diabetes
