title: IsibloomTM (Desogestrel and Ethinyl Estradiol Tablets, USP) 0.15 mg/0.03 mg Rx only
product_name: Isibloom
active_moieties:
- DESOGESTREL
- ETHINYL ESTRADIOL
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - 'Isibloom TM (desogestrel and ethinyl estradiol tablets) are indicated for the prevention of pregnancy
    in women who elect to use oral contraceptives as a method of contraception. Oral contraceptives are
    highly effective. Table 1 lists the typical accidental pregnancy rates for users of combined oral
    contraceptives and other methods of contraception. The efficacy of these contraceptive methods, except
    sterilization, the IUD, and the Norplant System depends upon the reliability with which they are used.
    Correct and consistent use of these methods can result in lower failure rates. In a clinical trial
    with desogestrel and ethinyl estradiol tablets, 1,195 subjects completed 11,656 cycles and a total
    of 10 pregnancies were reported. This represents an overall user-efficacy (typical user-efficacy)
    pregnancy rate of 1.12 per 100 women-years. This rate includes patients who did not take the drug
    correctly. TABLE 1: PERCENTAGE OF WOMEN EXPERIENCING AN UNINTENDED PREGNANCY DURING THE FIRST YEAR
    OF TYPICAL USE AND THE FIRST YEAR OF PERFECT USE OF CONTRACEPTION AND THE PERCENTAGE CONTINUING USE
    AT THE END OF THE FIRST YEAR. UNITED STATES. % of Women Experiencing an Unintended Pregnancy within
    the First Year of Use % of Women Continuing Use at One Year a Method (1) Typical Use b (2) Perfect
    Use c (3) (4) Chance f 85 85 Spermicides g 26 6 40 Periodic abstinence 25 63 Calendar 9 Ovulation
