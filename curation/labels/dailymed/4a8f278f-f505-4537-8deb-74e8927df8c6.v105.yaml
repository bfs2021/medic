    ® 0.05 0.05 88 Female Sterilization 0.5 0.5 100 Male Sterilization 0.15 0.10 100 Emergency Contraceptive
    Pills: Treatment initiated within 72 hours after unprotected intercourse reduces the risk of pregnancy
    by at least 75%. d Lactation Amenorrhea Method: LAM is a highly effective, temporary method of contraception.
    e Source: Trussel J. Contraceptive efficacy. In Hatcher RA, Trussell J, Stewart F, Cates W, Stewart
    GK, Kowel D, Guest F, Contraceptive Technology: Seventeenth Revised Edition. New York, NY; Irvington
    Publishers, 1998. a Among couples attempting to avoid pregnancy, the percentage who continue to use
    a method for one year. b Among typical couples who initiate use of a method (not necessarily for the
    first time), the percentage who experience an accidental pregnancy during the first year if they do
    not stop use for any other reason. c Among couples who initiate use of a method (not necessarily for
    the first time) and who use it perfectly (both consistently and correctly), the percentage who experience
    an accidental pregnancy during the first year if they do not stop use for any other reason. d The
    treatment schedule is one dose within 72 hours after unprotected intercourse, and a second dose 12
    hours after the first dose. The FDA has declared the following brands of oral contraceptives to be
    safe and effective for emergency contraception: Ovral® (1 dose is 2 white pills), Alesse® (1 dose
    is 5 pink pills), Nordette® or Levlen® (1 dose is 4 yellow pills). e However, to maintain effective
    protection against pregnancy, another method of contraception must be used as soon as menstruation
    resumes, the frequency of duration of breastfeeds is reduced, bottle feeds are introduced, or the
    baby reaches 6 months of age. f The percents becoming pregnant in columns (2) and (3) are based on
    data from populations where contraception is not used and from women who cease using contraception
    in order to become pregnant. Among such populations, about 89% become pregnant within one year. This
    estimate was lowered slightly (to 85%) to represent the percent who would become pregnant within one
    year among women now relying on reversible methods of contraception if they abandoned contraception
    altogether. g Foams, creams, gels, vaginal suppositories, and vaginal film. h Cervical mucus (ovulation)
    method supplemented by calendar in the pre-ovulatory and basal body temperature in the post-ovulatory
    phases. i With spermicidal cream or jelly. j Without spermicides. Desogestrel and ethinyl estradiol
    tablets have not been studied for and are not indicated for use in emergency contraception.'
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - 'Isibloom is contraindicated in females who are known to have or develop the following conditions:
    • Thrombophlebitis or thromboembolic disorders • A past history of deep vein thrombophlebitis or thromboembolic
    disorders • Known thrombophilic conditions • Cerebral vascular or coronary artery disease (current
    or history) • Valvular heart disease with complications • Persistent blood pressure values of ≥ 160
    mm Hg systolic or ≥ 100 mg Hg diastolic 102 • Diabetes with vascular involvement • Headaches with
    focal neurological symptoms • Major surgery with prolonged immobilization • Current diagnosis of,
    or history of, breast cancer, which may be hormone sensitive • Carcinoma of the endometrium or other
    known or suspected estrogen-dependent neoplasia • Undiagnosed abnormal genital bleeding • Cholestatic
    jaundice of pregnancy or jaundice with prior pill use • Acute or chronic hepatocellular disease with
    abnormal liver function • Hepatic adenomas or carcinomas • Known or suspected pregnancy • Hypersensitivity
    to any component of this product • Are receiving Hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir,
    with or without dasabuvir, due to the potential for ALT elevations (see Warnings, RISK OF LIVER ENZYME
    ELEVATIONS WITH CONCOMITANT HEPATITIS C TREATMENT).'
