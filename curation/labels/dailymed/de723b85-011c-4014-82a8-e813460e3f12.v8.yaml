sections:
  INDICATIONS:
  - Uses
  - 'for the temporary relief of these symptoms associated with menstrual periods: bloating headache water-weight
    gain cramps backache fatigue muscle aches'
  CONTRAINDICATIONS:
  - Do not use
  - with any other drug containing acetaminophen (prescription or nonprescription). If you are not sure
    whether a drug contains acetaminophen, ask a doctor or pharmacist. if you have ever had an allergic
    reaction to this product or any of its ingredients
