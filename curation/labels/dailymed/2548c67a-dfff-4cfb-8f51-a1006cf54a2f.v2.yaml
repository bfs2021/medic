title: Tricode AR
product_name: TricodeAR
active_moieties:
- CHLORPHENIRAMINE
- CODEINE
- PSEUDOEPHEDRINE
sections:
  INDICATIONS:
  - Uses
  - 'temporarily relieves these symptoms due to the common cold, hay fever (allergic rhinitis) or other
    upper respiratory allergies: runny nose sneezing itching of the nose or throat itchy, watery eyes
    cough due to minor throat and bronchial irritation nasal congestion reduces swelling of nasal passages'
  CONTRAINDICATIONS:
  - Do not use this product
  - if you are now taking a prescription monoamine oxidase inhibitor (MAOI) (certain drugs for depression,
    psychiatric, or emotional conditions, or Parkinson's disease), or for 2 weeks after stopping the MAOI
    drug. If you do not know if your prescription drug contains an MAOI, ask a doctor or pharmacist before
    taking this product
