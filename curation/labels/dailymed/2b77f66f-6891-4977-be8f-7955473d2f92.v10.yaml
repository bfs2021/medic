title: 'These highlights do not include all the information needed to use METOPROLOL TARTRATE AND HYDROCHLOROTHIAZIDE
  TABLETS safely and effectively. See full prescribing information for METOPROLOL TARTRATE AND HYDROCHLOROTHIAZIDE
  TABLETS METOPROLOL TARTRATE and HYDROCHLOROTHIAZIDE TABLETS, for oral use Initial U.S. Approval: 1984'
product_name: Metoprolol Tartrate and Hydrochlorothiazide
active_moieties:
- HYDROCHLOROTHIAZIDE
- METOPROLOL
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - Metoprolol tartrate and hydrochlorothiazide tablets are indicated for the treatment of hypertension,
    to lower blood pressure. Lowering blood pressure lowers the risk of fatal and non-fatal cardiovascular
    events, primarily strokes and myocardial infarctions. These benefits have been seen in controlled
    trials of antihypertensive drugs from a wide variety of pharmacologic classes including metoprolol.
    Control of high blood pressure should be part of comprehensive cardiovascular risk management, including,
    as appropriate, lipid control, diabetes management, antithrombotic therapy, smoking cessation, exercise,
    and limited sodium intake. Many patients will require more than 1 drug to achieve blood pressure goals.
    For specific advice on goals and management, see published guidelines, such as those of the National
    High Blood Pressure Education Program’s Joint National Committee on Prevention, Detection, Evaluation,
    and Treatment of High Blood Pressure (JNC). Numerous antihypertensive drugs, from a variety of pharmacologic
    classes and with different mechanisms of action, have been shown in randomized controlled trials to
    reduce cardiovascular morbidity and mortality, and it can be concluded that it is blood pressure reduction,
    and not some other pharmacologic property of the drugs, that is largely responsible for those benefits.
    The largest and most consistent cardiovascular outcome benefit has been a reduction in the risk of
    stroke, but reductions in myocardial infarction and cardiovascular mortality also have been seen regularly.
    Elevated systolic or diastolic pressure causes increased cardiovascular risk, and the absolute risk
    increase per mmHg is greater at higher blood pressures, so that even modest reductions of severe hypertension
    can provide substantial benefit. Relative risk reduction from blood pressure reduction is similar
    across populations with varying absolute risk, so the absolute benefit is greater in patients who
    are at higher risk independent of their hypertension (for example, patients with diabetes or hyperlipidemia),
    and such patients would be expected to benefit from more aggressive treatment to a lower blood pressure
    goal. Some antihypertensive drugs have smaller blood pressure effects (as monotherapy) in black patients,
    and many antihypertensive drugs have additional approved indications and effects (e.g., on angina,
    heart failure, or diabetic kidney disease). These considerations may guide selection of therapy. Metoprolol
    tartrate and hydrochlorothiazide tablets may be administered with other antihypertensive agents. Limitation
    of Use Metoprolol tartrate and hydrochlorothiazide tablets are not indicated for initial therapy of
    hypertension. If the fixed combination represents the dose titrated to the individual patient’s needs,
    therapy with the fixed combination may be more convenient than with the separate components.
  - Metoprolol tartrate and hydrochlorothiazide tablet is the combination tablet of metoprolol tartrate,
    a beta adrenoceptor blocker and hydrochlorothiazide (HCTZ), a thiazide diuretic, indicated for the
    treatment of hypertension, to lower blood pressure. Lowering blood pressure reduces the risk of fatal
    and nonfatal cardiovascular events, primarily strokes and myocardial infarctions. (1)
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Metoprolol tartrate and hydrochlorothiazide tablets are contraindicated in patients with: Cardiogenic
    shock or decompensated heart failure. Sinus bradycardia, sick sinus syndrome, and greater than first-degree
    block unless a permanent pacemaker is in place. Anuria Hypersensitivity to metoprolol tartrate or
    hydrochlorothiazide or to other sulfonamide derived drugs.'
  - Hypersensitivity to metoprolol tartrate or hydrochlorothiazide or other sulfonamide-derived drugs.
    (4) Cardiogenic shock or decompensated heart failure. (4) Sinus bradycardia, sick sinus syndrome,
    and greater than first-degree block unless a permanent pacemaker is in place. (4) Anuria. (4)
