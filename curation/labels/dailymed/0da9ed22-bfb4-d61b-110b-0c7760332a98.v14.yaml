title: Drug Facts
product_name: ADVIL COLD AND SINUS
active_moieties:
- IBUPROFEN
- PSEUDOEPHEDRINE
sections:
  INDICATIONS:
  - Uses
  - 'temporarily relieves these symptoms associated with the common cold or flu: headache fever sinus
    pressure nasal congestion minor body aches and pains'
  CONTRAINDICATIONS:
  - Do not use
  - in children under 12 years of age if you have ever had an allergic reaction to any other pain reliever/fever
    reducer right before or after heart surgery if you are now taking a prescription monoamine oxidase
    inhibitor (MAOI) (certain drugs for depression, psychiatric, or emotional conditions, or Parkinson's
    disease), or for 2 weeks after stopping the MAOI drug. If you do not know if your prescription drug
    contains an MAOI, ask a doctor or pharmacist before taking this product.
