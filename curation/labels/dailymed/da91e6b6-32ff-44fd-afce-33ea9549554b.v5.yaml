title: Amerisource Bergen Cold & Cough Drug Facts
product_name: good neighbor pharmacy cold and cough
active_moieties:
- BROMPHENIRAMINE
- DEXTROMETHORPHAN
- PHENYLEPHRINE
sections:
  INDICATIONS:
  - Uses
  - '• temporarily relieves cough due to minor throat and bronchial irritation occurring with a cold,
    and nasal congestion due to the common cold, hay fever or other upper respiratory allergies • temporarily
    relieves these symptoms due to hay fever (allergic rhinitis): • runny nose • sneezing • itchy, watery
    eyes • itching of the nose or throat • temporarily restores freer breathing through the nose'
  CONTRAINDICATIONS:
  - Do not use
  - • if you are now taking a prescription monoamine oxidase inhibitor (MAOI) (certain drugs for depression,
    psychiatric or emotional conditions, or Parkinson’s disease), or for 2 weeks after stopping the MAOI
    drug. If you do not know if your prescription drug contains an MAOI, ask a doctor or pharmacist before
    taking this product. • to make a child sleepy
