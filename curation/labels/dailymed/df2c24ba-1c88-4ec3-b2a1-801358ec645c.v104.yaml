title: 'HIGHLIGHTS OF PRESCRIBING INFORMATION These highlights do not include all the information needed
  to use PROMETHAZINE HCL AND CODEINE PHOSPHATE ORAL SOLUTION safely and effectively. See full prescribing
  information for PROMETHAZINE HCL AND CODEINE PHOSPHATE ORAL SOLUTION. PROMETHAZINE HCL and CODEINE PHOSPHATE
  oral solution, CV Initial U.S. Approval: 1952'
product_name: Promethazine Hydrochloride and Codeine Phosphate
active_moieties:
- CODEINE ANHYDROUS
- PROMETHAZINE
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - Promethazine HCl and Codeine Phosphate Oral Solution is indicated for the temporary relief of coughs
    and upper respiratory symptoms associated with allergy or the common cold in patients 18 years of
    age and older. Important Limitations of Use Not indicated for pediatric patients under 18 years of
    age [ see Use in Specific Populations (8.4) ]. Contraindicated in pediatric patients under 12 years
    of age [ see Contraindications (4) , Use in Specific Populations (8.4) ]. Contraindicated in pediatric
    patients 12 to 18 years of age after tonsillectomy or adenoidectomy [ see Contraindications (4) ,
    Use in Specific Populations (8.4) ]. Because of the risks of addiction, abuse, and misuse with opioids,
    even at recommended doses [ see Warnings and Precautions (5.1) ], reserve Promethazine HCl and Codeine
    Phosphate Oral Solution for use in adult patients for whom the benefits of cough suppression are expected
    to outweigh the risks, and in whom an adequate assessment of the etiology of the cough has been made.
  - Promethazine HCl and Codeine Phosphate Oral Solution is a combination of codeine, an opioid agonist;
    and promethazine, a phenothiazine, indicated for the temporary relief of cough and upper respiratory
    symptoms associated with allergy or the common cold in patients 18 years of age and older. ( 1 ) Important
    Limitations of Use ( 1 ) Not indicated for pediatric patients under 18 years of age. Because of the
    risks of addiction, abuse, and misuse with opioids, even at recommended doses, reserve Promethazine
    HCl and Codeine Phosphate Oral Solution for use in adult patients for whom the benefits of cough suppression
    are expected to outweigh the risks, and in whom an adequate assessment of the etiology of the cough
    has been made.
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Promethazine HCl and Codeine Phosphate Oral Solution is contraindicated for: All children younger
    than 12 years of age [ see Warnings and Precautions (5.2 , 5.3 , 5.5) , Use in Specific Populations
    (8.4) ]. Postoperative pain management in children younger than 18 years of age following tonsillectomy
    and/or adenoidectomy [ see Warnings and Precautions (5.2 , 5.3) ]. Promethazine HCl and Codeine Phosphate
    Oral Solution is also contraindicated in patients with: Significant respiratory depression [ see Warnings
    and Precautions (5.2) ]. Acute or severe bronchial asthma in an unmonitored setting or in the absence
    of resuscitative equipment [ see Warnings and Precautions (5.6) ]. Known or suspected gastrointestinal
    obstruction, including paralytic ileus [ see Warnings and Precautions (5.11) ]. A history of an idiosyncratic
    reaction to promethazine or to other phenothiazines [ see Warnings and Precautions (5.14) ]. Concurrent
    use of monoamine oxidase inhibitors (MAOIs) or use of MAOIs within 14 days [ see Warnings and Precautions
    (5.16) , Drug Interactions (7.6) ]. Hypersensitivity to codeine, promethazine, or any of the inactive
    ingredients in Promethazine HCl and Codeine Phosphate Oral Solution [ see Adverse Reactions (6) ].
    Persons known to be hypersensitive to certain other opioids may exhibit cross-reactivity to codeine.'
  - Children younger than 12 years of age. ( 4 ) Significant respiratory depression. ( 4 ) Acute or severe
    bronchial asthma in an unmonitored setting or in absence of resuscitative equipment. ( 4 ) Known or
    suspected gastrointestinal obstruction, including paralytic ileus. ( 4 ) Concurrent use of monoamine
    oxidase inhibitor (MAOI) therapy or within the last 14 days. ( 4 ) History of an idiosyncratic reaction
    to promethazine or to other phenothiazines. ( 4 ) Hypersensitivity to codeine or other opiates, promethazine,
    or any of the inactive ingredients in Promethazine HCl and Codeine Phosphate Oral Solution. ( 4 )
