title: Kelnor® 1/35 (28 Day Regimen) (ethynodiol diacetate and ethinyl estradiol tablets USP)
product_name: Kelnor 1/35
active_moieties:
- ETHINYL ESTRADIOL
- ETHYNODIOL
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - 'Kelnor 1/35 (28 Day Regimen) (ethynodiol diacetate and ethinyl estradiol tablets) is indicated for
    the prevention of pregnancy in women who elect to use oral contraceptives as a method of contraception.
    Oral contraceptives are highly effective. Table 1 lists the typical accidental pregnancy rates for
    users of combination oral contraceptives and other methods of contraception. The efficacy of these
    contraceptive methods, except sterilization and progestogen implants and injections, depends upon
    the reliability with which they are used. Correct and consistent use of methods can result in lower
    failure rates. TABLE 1: PERCENTAGE OF WOMEN EXPERIENCING AN UNINTENDED PREGNANCY DURING THE FIRST
    YEAR OF TYPICAL USE AND THE FIRST YEAR OF PERFECT USE OF CONTRACEPTION AND THE PERCENTAGE CONTINUING
    USE AT THE END OF THE FIRST YEAR. UNITED STATES. % of Women Experiencing an Unintended Pregnancy Within
    the First Year of Use % of Women Continuing Use at One Year 1 Method (1) Typical Use 2 (2) Perfect
    Use 3 (3) (4) Chance 4 85 85 Spermicides 5 26 6 40 Periodic abstinence 25 63 Calendar 9 Ovulation
    method 3 Sympto-thermal 6 2 Post-ovulation 1 Withdrawal 19 4 Cap 7 Parous women 40 26 42 Nulliparous
    women 20 9 56 Sponge Parous women 40 20 42 Nulliparous women 20 9 56 Diaphragm 7 20 6 56 Condom 8
    Female (Reality ® ) 21 5 56 Male 14 3 61 Pill 5 71 Progestin only 0.5 Combined 0.1 IUD Progesterone
    T 2 1.5 81 Copper T 380A 0.8 0.6 78 LNg 20 0.1 0.1 81 Injection (Depo-Provera ® ) 0.3 0.3 70 Implant
    (Norplant ® and Norplant-2 ® ) 0.05 0.05 88 Female sterilization 0.5 0.5 100 Male sterilization 0.15
    0.1 100 Emergency Contraceptive Pills: Treatment initiated within 72 hours after unprotected intercourse
    reduces the risk of pregnancy by at least 75%. 9 Lactational Amenorrhea Method: LAM is a highly effective,
    temporary method of contraception. 10 Source: Trussell J, Contraceptive efficacy. In Hatcher RA, Trussell
    J, Stewart F, Cates W, Stewart GK, Kowal D, Guest F, Contraceptive Technology: Seventeenth Revised
    Edition . New York, NY: Irvington Publishers, 1998, in press. 1 1. Among couples attempting to avoid
    pregnancy, the percentage who continue to use a method for one year. 2. Among typical couples who
    initiate use of a method (not necessarily for the first time), the percentage who experience an accidental
    pregnancy during the first year if they do not stop use for any other reason. 3. Among couples who
    initiate use of a method (not necessarily for the first time) and who use it perfectly (both consistently
    and correctly), the percentage who experience an accidental pregnancy during the first year if they
    do not stop use for any other reason. 4. The percents becoming pregnant in columns (2) and (3) are
    based on data from populations where contraception is not used and from women who cease using contraception
    in order to become pregnant. Among such populations, about 89% become pregnant within one year. This
    estimate was lowered slightly (to 85%) to represent the percent who would become pregnant within one
    year among women now relying on reversible methods of contraception if they abandoned contraception
    altogether. 5. Foams, creams, gels, vaginal suppositories, and vaginal film. 6. Cervical mucus (ovulation)
    method supplemented by calendar in the pre-ovulatory and basal body temperature in the post-ovulatory
    phases. 7. With spermicidal cream or jelly. 8. Without spermicides. 9. The treatment schedule is one
    dose within 72 hours after unprotected intercourse, and a second dose 12 hours after the first dose.
    The Food and Drug Administration has declared the following brands of oral contraceptives to be safe
    and effective for emergency contraception: Ovral ® (1 dose is 2 white pills), Alesse ® (1 dose is
    5 pink pills), Nordette ® or Levlen ® (1 dose is 2 light-orange pills), Lo/Ovral ® (1 dose is 4 white
    pills), Triphasil ® or Tri-Levlen ® (1 dose is 4 yellow pills). 10. However, to maintain effective
    protection against pregnancy, another method of contraception must be used as soon as menstruation
    resumes, the frequency or duration of breastfeeds is reduced, bottle feeds are introduced, or the
    baby reaches six months of age.'
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - 'Kelnor 1/35 is contraindicated in females who are known to have or develop the following conditions:
    Thrombophlebitis or thromboembolic disorders A past history of deep vein thrombophlebitis or thromboembolic
    disorders Cerebral vascular disease, myocardial infarction, or coronary artery disease, or a past
    history of these conditions Current diagnosis of, or history of, breast cancer, which may be hormone-sensitive
    Known or suspected carcinoma of the female reproductive organs or suspected estrogen-dependent neoplasia,
    or a history of these conditions Undiagnosed abnormal genital bleeding History of cholestatic jaundice
    of pregnancy or jaundice with prior oral contraceptive use Past or present, benign or malignant liver
    tumors Known or suspected pregnancy Are receiving Hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir,
    with or without dasabuvir, due to the potential for ALT elevations (see WARNINGS, Risk of Liver Enzyme
    Elevations with Concomitant Hepatitis C Treatment ).'
