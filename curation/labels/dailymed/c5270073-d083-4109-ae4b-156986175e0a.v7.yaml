title: 'These highlights do not include all the information needed to use NEXTSTELLIS safely and effectively.
  See full prescribing information for NEXTSTELLIS. NEXTSTELLIS® (drospirenone and estetrol tablets),
  for oral use Initial U.S. Approval: 2021'
product_name: Nextstellis
active_moieties:
- DROSPIRENONE
- ESTETROL
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - NEXTSTELLIS is indicated for use by females of reproductive potential to prevent pregnancy.
  - NEXTSTELLIS is a combination of drospirenone, a progestin, and estetrol, an estrogen, indicated for
    use by females of reproductive potential to prevent pregnancy. ( 1 ) Limitations of Use NEXTSTELLIS
    may be less effective in females with a BMI ≥ 30 kg/m 2 . In females with BMI ≥ 30 kg/m 2 , decreasing
    effectiveness may be associated with increasing BMI ( 14 ).
  - Limitations of Use NEXTSTELLIS may be less effective in females with a BMI ≥ 30 kg/m 2 . In females
    with BMI ≥ 30 kg/m 2 , decreasing effectiveness may be associated with increasing BMI [see Clinical
    Studies (14) ].
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'NEXTSTELLIS is contraindicated in females who are known to have or develop the following conditions:
    A history of, increased risk for, or current arterial or venous thrombotic/thromboembolic diseases.
    Examples include females who are known to: - Smoke, if 35 years of age and older [see Boxed Warning
    and Warnings and Precautions (5.1) ] - Have current or history of deep vein thrombosis or pulmonary
    embolism [see Warnings and Precautions (5.1) ] - Have cerebrovascular disease [see Warnings and Precautions
    (5.1) ] - Have coronary artery disease [see Warnings and Precautions (5.1) ] - Have thrombogenic valvular
    or thrombogenic rhythm diseases of the heart (for example, subacute bacterial endocarditis with valvular
    disease, or atrial fibrillation) [see Warnings and Precautions (5.1) ] - Have inherited or acquired
    hypercoagulopathies [see Warnings and Precautions (5.1) ] - Have uncontrolled hypertension or hypertension
    with vascular disease [see Warnings and Precautions (5.1) ] - Have diabetes mellitus with hypertension
    or end-organ damage; or diabetes mellitus of > 20 years duration [see Warnings and Precautions (5.9)
    ] - Have migraine headaches with aura [see Warnings and Precautions (5.4) ] Current diagnosis of,
    or history of, breast cancer, which may be hormone-sensitive [see Warnings and Precautions (5.5) ]
    Hepatic adenoma, hepatocellular carcinoma, acute hepatitis, or severe (decompensated) cirrhosis [see
    Warnings and Precautions (5.6) ] Use of hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir,
    with or without dasabuvir, due to the potential for ALT elevations [see Warnings and Precautions (5.7)
    ] Abnormal uterine bleeding that has an undiagnosed etiology [see Warnings and Precautions (5.5) ]
    Renal Impairment [see Warnings and Precautions (5.2) ] Adrenal insufficiency [see Warnings and Precautions
    (5.2) ]'
  - A high risk of arterial or venous thrombotic diseases ( 4 ) Breast cancer or history of breast cancer
