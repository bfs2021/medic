  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - Do not co-administer aliskiren with amlodipine and olmesartan medoxomil tablets in patients with diabetes
    [see Drug Interactions (7.2) ].
  - Do not co-administer aliskiren with amlodipine and olmesartan medoxomil tablets in patients with diabetes
