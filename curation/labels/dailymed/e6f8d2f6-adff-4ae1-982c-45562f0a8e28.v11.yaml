title: Neomycin and Polymyxin B Sulfates and Gramicidin Ophthalmic Solution, USP
product_name: NEOMYCIN AND POLYMYXIN B SULFATES AND GRAMICIDIN
active_moieties:
- GRAMICIDIN
- NEOMYCIN
- POLYMYXIN B
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - Neomycin and polymyxin B sulfates and gramicidin ophthalmic solution is indicated for the topical
    treatment of superficial infections of the external eye and its adnexa caused by susceptible bacteria.
    Such infections encompass conjunctivitis, keratitis and keratoconjunctivitis, blepharitis and blepharoconjunctivitis.
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - This product is contraindicated in those persons who have shown hypersensitivity to any of its components.
