title: 'These highlights do not include all the information needed to use ETONOGESTREL AND ETHINYL ESTRADIOL
  VAGINAL RING safely and effectively. See full prescribing information for ETONOGESTREL AND ETHINYL ESTRADIOL
  VAGINAL RING. ETONOGESTREL AND ETHINYL ESTRADIOL vaginal ring Initial U.S. Approval: 2001'
product_name: Etonogestrel and Ethinyl Estradiol
active_moieties:
- ETHINYL ESTRADIOL
- ETONOGESTREL
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - FOR VAGINAL USE ONLY Etonogestrel and ethinyl estradiol vaginal ring is indicated for use by females
    of reproductive age to prevent pregnancy.
  - Etonogestrel and ethinyl estradiol vaginal ring is an estrogen/progestin combination hormonal contraceptive
    (CHC) indicated for use by women to prevent pregnancy. ( 1 )
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Etonogestrel and ethinyl estradiol vaginal ring is contraindicated in females who are known to have
    or develop the following conditions: A high risk of arterial or venous thrombotic diseases. Examples
    include women who are known to: Smoke, if over age 35 [see Boxed Warning and Warnings and Precautions
    ( 5.1 )] Have deep vein thrombosis or pulmonary embolism, now or in the past [see Warnings and Precautions
    ( 5.1 )] Have cerebrovascular disease [see Warnings and Precautions ( 5.1 )] Have coronary artery
    disease [see Warnings and Precautions ( 5.1 )] Have thrombogenic valvular or thrombogenic rhythm diseases
    of the heart (for example, subacute bacterial endocarditis with valvular disease, or atrial fibrillation)
    [see Warnings and Precautions ( 5.1 )] Have inherited or acquired hypercoagulopathies [see Warnings
    and Precautions ( 5.1 )] Have uncontrolled hypertension [see Warnings and Precautions ( 5.5 )] Have
    diabetes mellitus with vascular disease [see Warnings and Precautions ( 5.9 )] Have headaches with
    focal neurological symptoms or migraine headaches with aura [see Warnings and Precautions (5.10)]
    Women over age 35 with any migraine headaches [see Warnings and Precautions ( 5.10 )] Liver tumors,
    benign or malignant or liver disease [see Warnings and Precautions ( 5.3 ) and Use in Specific Populations
    ( 8.6 )] Undiagnosed abnormal uterine bleeding [see Warnings and Precautions ( 5.11 )] Pregnancy,
    because there is no reason to use CHCs during pregnancy [see Use in Specific Populations ( 8.1 )]
    Current diagnosis of, or history of, breast cancer, which may be hormone-sensitive [see Warnings and
    Precautions ( 5.14 )] Hypersensitivity reactions, including anaphylaxis and angioedema, to any of
    the components of etonogestrel and ethinyl estradiol vaginal ring [see Warnings and Precautions (
    5.6 ) and Adverse Reactions ( 6 )] Use of Hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir,
    with or without dasabuvir, due to potential for ALT elevations [see Warnings and Precautions ( 5.4
    )] .'
  - A high risk of arterial or venous thrombotic diseases ( 4 ) Breast cancer ( 4 ) Liver tumors or liver
    disease ( 4 ) Undiagnosed abnormal uterine bleeding ( 4 ) Pregnancy ( 4 ) Hypersensitivity, including
    anaphylaxis and angioedema, to any of the components of etonogestrel and ethinyl estradiol vaginal
    ring ( 4 ) Coadministration with Hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir,
    with or without dasabuvir ( 4 )
