  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - PRESTALIA tablets are contraindicated in patients with hereditary or idiopathic angioedema, with or
    without previous ACE inhibitor treatment, and in patients who are hypersensitive to perindopril, to
    any other ACE inhibitor, or to amlodipine. Do not co-administer aliskiren with ACE inhibitors, including
    PRESTALIA, in patients with diabetes. Prestalia is contraindicated in combination with neprilysin
    inhibitor (e.g., sacubitril). Do not administer Prestalia within 36 hours of switching to or from
    sacubitril/valsartan, a neprilysin inhibitor [ see Warnings and Precautions (5.2) ] .
  - History of angioedema, or hypersensitivity to any ACE-inhibitor or to amlodipine ( 4 ). Do not use
    aliskiren with PRESTALIA in patients with diabetes ( 4 ). Do not take a neprilysin inhibitor with
    PRESTALIA ( 4 ). Do not administer PRESTALIA within 36 hours of switching to or from sacubitril/valsartan
    ( 4 ).
