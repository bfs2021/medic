title: 'These highlights do not include all the information needed to use Drospirenone, Ethinyl Estradiol
  and Levomefolate Calcium Tablets and Levomefolate Calcium Tablets safely and effectively. See full prescribing
  information for Drospirenone, Ethinyl Estradiol and Levomefolate Calcium Tablets and Levomefolate Calcium
  Tablets. DROSPIRENONE, ETHINYL ESTRADIOL and LEVOMEFOLATE CALCIUM Tablets and LEVOMEFOLATE CALCIUM Tablets,
  for oral use Initial U.S. Approval: 2010'
product_name: DROSPIRENONE, ETHINYL ESTRADIOL AND LEVOMEFOLATE CALCIUM AND LEVOMEFOLATE CALCIUM
active_moieties:
- DROSPIRENONE
- ETHINYL ESTRADIOL
- LEVOMEFOLIC ACID
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'Drospirenone, ethinyl estradiol and levomefolate calcium tablet and levomefolate calcium tablet is
    an estrogen/progestin COC containing a folate, indicated for use by women to:'
  - 1.1 Oral Contraceptive
  - Drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium tablets
    are indicated for use by women to prevent pregnancy.
  - 1.2 Premenstrual Dysphoric Disorder (PMDD)
  - Drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium tablets
    are also indicated for the treatment of symptoms of premenstrual dysphoric disorder (PMDD) in women
    who choose to use an oral contraceptive as their method of contraception. The effectiveness of drospirenone,
    ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium tablets for PMDD when
    used for more than three menstrual cycles has not been evaluated. The essential features of PMDD according
    to the Diagnostic and Statistical Manual-4th edition (DSM-IV) include markedly depressed mood, anxiety
    or tension, affective lability, and persistent anger or irritability. Other features include decreased
    interest in usual activities, difficulty concentrating, lack of energy, change in appetite or sleep,
    and feeling out of control. Physical symptoms associated with PMDD include breast tenderness, headache,
    joint and muscle pain, bloating and weight gain. In this disorder, these symptoms occur regularly
    during the luteal phase and remit within a few days following onset of menses; the disturbance markedly
    interferes with work or school, or with usual social activities and relationships with others. Diagnosis
    is made by healthcare providers according to DSM-IV criteria, with symptomatology assessed prospectively
    over at least two menstrual cycles. In making the diagnosis, care should be taken to rule out other
    cyclical mood disorders. Drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate
    calcium tablets has not been evaluated for the treatment of premenstrual syndrome (PMS).
  - 1.3 Acne
  - Drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium tablets
    are indicated for the treatment of moderate acne vulgaris in women at least 14 years of age, who have
    no known contraindications to oral contraceptive therapy and have achieved menarche. Drospirenone,
    ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium tablets should be used
    for the treatment of acne only if the patient desires an oral contraceptive for birth control.
  - 1.4 Folate Supplementation
  - Drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate calcium tablets
    are indicated in women who choose to use an oral contraceptive as their method of contraception, to
    raise folate levels for the purpose of reducing the risk of a neural tube defect in a pregnancy conceived
    while taking the product or shortly after discontinuing the product.
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Do not prescribe drospirenone, ethinyl estradiol and levomefolate calcium tablets and levomefolate
    calcium tablets to women who are known to have the following: Renal impairment Adrenal insufficiency
    A high risk of arterial or venous thrombotic diseases. Examples include women who are known to: Smoke,
    if over age 35 [see Boxed Warning and Warnings And Precautions ( 5.1 )] Have deep vein thrombosis
    or pulmonary embolism, now or in the past [see Warnings And Precautions ( 5.1 )] Have cerebrovascular
    disease [see Warnings And Precautions ( 5.1 )] Have coronary artery disease [see Warnings And Precautions
    ( 5.1 )] Have thrombogenic valvular or thrombogenic rhythm diseases of the heart (for example, subacute
    bacterial endocarditis with valvular disease, or atrial fibrillation) [see Warnings And Precautions
    ( 5.1 )] Have inherited or acquired hypercoagulopathies [see Warnings And Precautions ( 5.1 )] Have
    uncontrolled hypertension [see Warnings And Precautions ( 5.5 )] Have diabetes mellitus with vascular
    disease [see Warnings And Precautions ( 5.7 )] Have headaches with focal neurological symptoms or
    have migraine headaches with or without aura if over age 35 [see Warnings And Precautions ( 5.8 )]
    Undiagnosed abnormal uterine bleeding [see Warnings And Precautions ( 5.9 )] Breast cancer or other
    estrogen- or progestin-sensitive cancer, now or in the past [see Warnings And Precautions ( 5.3 )]
    Liver tumors, benign or malignant, or liver disease [see Warnings And Precautions (5.4) and Use In
    Specific Populations ( 8.7 )] Pregnancy, because there is no reason to use COCs during pregnancy [see
    Warnings And Precautions ( 5.10 ) and Use In Specific Populations ( 8.1 )] Use of Hepatitis C drug
    combinations containing ombitasvir/paritaprevir/ritonavir, with or without dasabuvir due to the potential
    for ALT elevations [see Warnings And Precautions ( 5.5 ) and Drug Interactions 7.3 )]. ('
  - Renal impairment ( 4 ) Adrenal insufficiency ( 4 ) A high risk of arterial or venous thrombotic diseases
    ( 4 ) Undiagnosed abnormal uterine bleeding ( 4 ) Breast cancer or other estrogen- or progestin-sensitive
    cancer ( 4 ) Liver tumors or liver disease ( 4 ) Pregnancy ( 4 ) Co-administration with Hepatitis
    C drug combinations containing ombitasvir, paritaprevir/ritonavir, with or without dasabuvir ( 4 )
