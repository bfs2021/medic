sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - ANNOVERA is indicated for use by females of reproductive potential to prevent pregnancy. Limitations
    of Use ANNOVERA has not been adequately studied in females with a BMI >29 kg/m 2 .
  - ANNOVERA is a progestin/estrogen CHC indicated for use by females of reproductive potential to prevent
    pregnancy. ( 1 ) Limitation of Usage Not adequately evaluated in females with a body mass index of
    >29 kg/m 2 ( 1 )
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'ANNOVERA is contraindicated in females who are known to have or develop the following conditions:
    A high risk of arterial or venous thrombotic diseases. Examples include females who are known to:
    - Smoke, if over age 35 [see Boxed Warning and Warnings and Precautions (5.1) ]. - Have current or
    history of deep vein thrombosis or pulmonary embolism [see Warnings and Precautions (5.1) ] . - Have
    cerebrovascular disease [see Warnings and Precautions (5.1) ]. - Have coronary artery disease [see
    Warnings and Precautions (5.1) ]. - Have thrombogenic valvular or thrombogenic rhythm diseases of
    the heart (for example, subacute bacterial endocarditis with valvular disease, or atrial fibrillation)
    [see Warnings and Precautions (5.1) ] . - Have inherited or acquired hypercoagulopathies [see Warnings
    and Precautions (5.1) ] . - Have uncontrolled hypertension or hypertension with vascular disease [see
    Warnings and Precautions (5.4) ] . - Have diabetes mellitus and are over age 35, diabetes mellitus
    with hypertension or vascular disease, or other end-organ damage, or diabetes mellitus of >20 years
    duration [see Warnings and Precautions (5.5) , (5.7) ] . - Have headaches with focal neurological
    symptoms, migraine headaches with aura, or are over age 35 with any migraine headaches [see Warnings
    and Precautions (5.8) ] . Current diagnosis of, or history of, breast cancer, which may be hormone-sensitive
    [see Warnings and Precautions (5.11) ] . Liver tumors, acute hepatitis, or severe (decompensated)
    cirrhosis [see Warnings and Precautions (5.2) and Use in Specific Populations (8.6) ]. Undiagnosed
    abnormal uterine bleeding [see Warnings and Precautions (5.9) ] . Hypersensitivity to any of the components
    of ANNOVERA. Hypersensitivity reactions reported include: throat constriction, facial edema, urticaria,
    hives, and wheezing [see Adverse Reactions (6.1) ] . Use of Hepatitis C drug combinations containing
    ombitasvir/paritaprevir/ritonavir, with or without dasabuvir, due to the potential for alanine transaminase
    (ALT) elevations [see Warnings and Precautions (5.3) ].'
