product_name: Caduet
active_moieties:
- AMLODIPINE
- ATORVASTATIN
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - 'CADUET (amlodipine and atorvastatin) is indicated in patients for whom treatment with both amlodipine
    and atorvastatin is appropriate. Amlodipine1. Hypertension : Amlodipine is indicated for the treatment
    of hypertension. It may be used alone or in combination with other antihypertensive agents; 2. Coronary
    Artery Disease (CAD) Chronic Stable Angina: Amlodipine is indicated for the treatment of chronic stable
    angina. Amlodipine may be used alone or in combination with other antianginal or antihypertensive
    agents; Vasospastic Angina (Prinzmetal''s or Variant Angina): Amlodipine is indicated for the treatment
    of confirmed or suspected vasospastic angina. Amlodipine may be used as monotherapy or in combination
    with other antianginal drugs. Angiographically Documented CAD: In patients with recently documented
    CAD by angiography and without heart failure or an ejection fraction less than 40%, amlodipine is
    indicated to reduce the risk of hospitalization due to angina and to reduce the risk of a coronary
    revascularization procedure. AND Atorvastatin Therapy with lipid-altering agents should be only one
    component of multiple risk factor intervention in individuals at significantly increased risk for
    atherosclerotic vascular disease due to hypercholesterolemia. Drug therapy is recommended as an adjunct
    to diet when the response to a diet restricted in saturated fat and cholesterol and other nonpharmacologic
    measures alone has been inadequate. In patients with CHD or multiple risk factors for CHD, the atorvastatin
    component of CADUET can be started simultaneously with diet restriction. 1. Prevention of Cardiovascular
    Disease: In adult patients without clinically evident coronary heart disease, but with multiple risk
    factors for coronary heart disease such as age, smoking, hypertension, low HDL-C, or a family history
    of early coronary heart disease, atorvastatin is indicated to: Reduce the risk of myocardial infarction
    Reduce the risk of stroke Reduce the risk for revascularization procedures and angina In patients
    with type 2 diabetes, and without clinically evident coronary heart disease, but with multiple risk
    factors for coronary heart disease such as retinopathy, albuminuria, smoking, or hypertension, LIPITOR
    is indicated to: Reduce the risk of myocardial infarction Reduce the risk of stroke; In patients with
    clinically evident coronary heart disease, LIPITOR is indicated to: Reduce the risk of non-fatal myocardial
    infarction Reduce the risk of fatal and non-fatal stroke Reduce the risk for revascularization procedures
    Reduce the risk of hospitalization for CHF Reduce the risk of angina 2. Heterozygous Familial and
    Nonfamilial Hyperlipidemia : Atorvastatin is indicated as an adjunct to diet to reduce elevated total-C,
    LDL-C, apo B, and TG levels and to increase HDL-C in patients with primary hypercholesterolemia (heterozygous
    familial and nonfamilial) and mixed dyslipidemia ( Fredrickson Types IIa and IIb); 3. Elevated Serum
    TG Levels : Atorvastatin is indicated as an adjunct to diet for the treatment of patients with elevated
    serum TG levels ( Fredrickson Type IV); 4. Primary Dysbetalipoproteinemia : Atorvastatin is indicated
    for the treatment of patients with primary dysbetalipoproteinemia ( Fredrickson Type III) who do not
    respond adequately to diet; 5. Homozygous Familial Hypercholesterolemia : Atorvastatin is indicated
    to reduce total-C and LDL-C in patients with homozygous familial hypercholesterolemia as an adjunct
    to other lipid-lowering treatments (e.g., LDL apheresis) or if such treatments are unavailable; 6.
    Pediatric Patients : Atorvastatin is indicated as an adjunct to diet to reduce total-C, LDL-C, and
    apo B levels in boys and postmenarchal girls, 10 to 17 years of age, with heterozygous familial hypercholesterolemia
    if after an adequate trial of diet therapy the following findings are present: LDL-C remains greater
    than or equal to 190 mg/dL or LDL-C remains greater than or equal to 160 mg/dL and: there is a positive
    family history of premature cardiovascular disease or two or more other CVD risk factors are present
    in the pediatric patients. The antidyslipidemic component of CADUET has not been studied in conditions
    where the major lipoprotein abnormality is elevation of chylomicrons ( Fredrickson Types I and V).'
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - CADUET contains atorvastatin and is therefore contraindicated in patients with active liver disease,
    which may include unexplained persistent elevations in hepatic transaminase levels. CADUET is contraindicated
    in patients with known hypersensitivity to any component of this medication. Pregnancy and Lactation
    CADUET contains atorvastatin and is therefore contraindicated in women who are pregnant or may become
    pregnant. The atorvastatin component of CADUET may cause fetal harm when administered to a pregnant
    woman. Serum cholesterol and triglycerides increase during normal pregnancy, and cholesterol or cholesterol
    derivatives are essential for fetal development. Atherosclerosis is a chronic process and discontinuation
    of lipid-lowering drugs during pregnancy should have little impact on the outcome of long-term therapy
    of primary hypercholesterolemia. There are no adequate and well-controlled studies of atorvastatin
    use during pregnancy; however in rare reports congenital anomalies were observed following intrauterine
    exposure to statins. In rat and rabbit animal reproduction studies, atorvastatin revealed no evidence
    of teratogenicity. CADUET, WHICH INCLUDES ATORVASTATIN, SHOULD BE ADMINISTERED TO WOMEN OF CHILDBEARING
    AGE ONLY WHEN SUCH PATIENTS ARE HIGHLY UNLIKELY TO CONCEIVE AND HAVE BEEN INFORMED OF THE POTENTIAL
    HAZARDS. If the patient becomes pregnant while taking this drug, therapy should be discontinued immediately
    and the patient apprised of the potential hazard to the fetus (see PRECAUTIONS, Pregnancy ). It is
    not known whether atorvastatin or amlodipine are excreted into human milk; however a small amount
    of another statin does pass into breast milk. Because statins have the potential for serious adverse
    reactions in nursing infants, women taking CADUET should not breastfeed their infants (see PRECAUTIONS,
    Nursing Mothers ).
