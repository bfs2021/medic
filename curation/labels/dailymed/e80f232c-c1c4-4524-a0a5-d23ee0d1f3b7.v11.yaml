title: 'These highlights do not include all the information needed to use TELMISARTAN AND HYDROCHLOROTHIAZIDE
  TABLETS safely and effectively. See full prescribing information for TELMISARTAN AND HYDROCHLOROTHIAZIDE
  TABLETS. TELMISARTAN and HYDROCHLOROTHIAZIDE tablets, for oral use Initial U.S. Approval: 2000'
product_name: Telmisartan and Hydrochlorothiazide
active_moieties:
- HYDROCHLOROTHIAZIDE
- TELMISARTAN
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - Telmisartan and hydrochlorothiazide tablets are indicated for the treatment of hypertension, to lower
    blood pressure. Lowering blood pressure reduces the risk of fatal and nonfatal cardiovascular events,
    primarily strokes and myocardial infarctions. These benefits have been seen in controlled trials of
    antihypertensive drugs from a wide variety of pharmacologic classes including the classes to which
    this drug principally belongs. There are no controlled trials demonstrating risk reduction with telmisartan
    and hydrochlorothiazide tablets. Control of high blood pressure should be part of comprehensive cardiovascular
    risk management, including, as appropriate, lipid control, diabetes management, antithrombotic therapy,
    smoking cessation, exercise, and limited sodium intake. Many patients will require more than one drug
    to achieve blood pressure goals. For specific advice on goals and management, see published guidelines,
    such as those of the National High Blood Pressure Education Program’s Joint National Committee on
    Prevention, Detection, Evaluation, and Treatment of High Blood Pressure (JNC). Numerous antihypertensive
    drugs, from a variety of pharmacologic classes and with different mechanisms of action, have been
    shown in randomized controlled trials to reduce cardiovascular morbidity and mortality, and it can
    be concluded that it is blood pressure reduction, and not some other pharmacologic property of the
    drugs, that is largely responsible for those benefits. The largest and most consistent cardiovascular
    outcome benefit has been a reduction in the risk of stroke, but reductions in myocardial infarction
    and cardiovascular mortality also have been seen regularly. Elevated systolic or diastolic pressure
    causes increased cardiovascular risk, and the absolute risk increase per mmHg is greater at higher
    blood pressures, so that even modest reductions of severe hypertension can provide substantial benefit.
    Relative risk reduction from blood pressure reduction is similar across populations with varying absolute
    risk, so the absolute benefit is greater in patients who are at higher risk independent of their hypertension
    (for example, patients with diabetes or hyperlipidemia), and such patients would be expected to benefit
    from more aggressive treatment to a lower blood pressure goal. Some antihypertensive drugs have smaller
    blood pressure effects (as monotherapy) in black patients, and many antihypertensive drugs have additional
    approved indications and effects (e.g., on angina, heart failure, or diabetic kidney disease). These
    considerations may guide selection of therapy [see Clinical Studies (14)]. Telmisartan and hydrochlorothiazide
    tablets are not indicated for initial therapy for the treatment of hypertension [see Dosage and Administration
    (2.1)]. Telmisartan and hydrochlorothiazide tablets may be used alone or in combination with other
    antihypertensive agents.
  - • Telmisartan and hydrochlorothiazide tablets are a combination of an angiotensin II receptor blocker
    (ARB) and a thiazide diuretic indicated for the treatment of hypertension, alone or with other antihypertensive
    agents, to lower blood pressure. Lowering blood pressure reduces the risk of fatal and nonfatal cardiovascular
    events, primarily strokes and myocardial infarctions (1) • Telmisartan and hydrochlorothiazide tablets
    are not indicated for initial therapy (1).
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Telmisartan and hydrochlorothiazide tablets are contraindicated: · In patients who are hypersensitive
    to any component of this product [see Warnings and Precautions (5.5)]. · In patients with anuria.
    · For co-administration with aliskiren in patients with diabetes [see Drug Interactions (7.4)].'
  - • Hypersensitivity to telmisartan or any component (4) • Anuria (4) • Co-Administration with aliskiren
    in patients with diabetes (4)
