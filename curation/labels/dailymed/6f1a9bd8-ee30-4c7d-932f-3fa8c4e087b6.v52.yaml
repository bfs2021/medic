title: 'These highlights do not include all the information needed to use CADUET safely and effectively.
  See full prescribing information for CADUET. CADUET® (amlodipine and atorvastatin) tablets, for oral
  use Initial U.S. Approval: 2004'
product_name: Caduet
active_moieties:
- AMLODIPINE
- ATORVASTATIN
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - CADUET (amlodipine and atorvastatin) is indicated in patients for whom treatment with both amlodipine
    and atorvastatin is appropriate.
  - 'CADUET is a combination of amlodipine besylate, a calcium channel blocker, and atorvastatin calcium,
    a HMG-CoA-reductase inhibitor (statin), indicated in patients for whom treatment with both amlodipine
    and atorvastatin is appropriate ( 1 ). Amlodipine is indicated for the treatment of hypertension,
    to lower blood pressure. Lowering blood pressure reduces the risk of fatal and non-fatal cardiovascular
    events, primarily strokes and myocardial infarctions. Amlodipine is indicated for the treatment of
    Coronary Artery Disease ( 1 ). Atorvastatin is indicated ( 1 ): • To reduce the risk of: o Myocardial
    infarction (MI), stroke, revascularization procedures, and angina in adults with multiple risk factors
    for coronary heart disease (CHD) but without clinically evident CHD. o MI and stroke in adults with
    type 2 diabetes mellitus with multiple risk factors for CHD but without clinically evident CHD. o
    Non-fatal MI, fatal and non-fatal stroke, revascularization procedures, hospitalization for congestive
    heart failure, and angina in adults with clinically evident CHD. • As an adjunct to diet to reduce
    low-density lipoprotein (LDL-C) in: o Adults with primary hyperlipidemia. o Adults and pediatric patients
    aged 10 years and older with heterozygous familial hypercholesterolemia (HeFH). • As an adjunct to
    other LDL-C-lowering therapies to reduce LDL-C in adults and pediatric patients aged 10 years and
    older with homozygous familial hypercholesterolemia. • As an adjunct to diet for the treatment of
    adults with: o Primary dysbetalipoproteinemia. o Hypertriglyceridemia.'
  - 'Amlodipine Hypertension Amlodipine is indicated for the treatment of hypertension, to lower blood
    pressure. Lowering blood pressure reduces the risk of fatal and non-fatal cardiovascular events, primarily
    strokes and myocardial infarctions. These benefits have been seen in controlled trials of antihypertensive
    drugs from a wide variety of pharmacologic classes including amlodipine. Control of high blood pressure
    should be part of comprehensive cardiovascular risk management, including, as appropriate, lipid control,
    diabetes management, antithrombotic therapy, smoking cessation, exercise, and limited sodium intake.
    Many patients will require more than one drug to achieve blood pressure goals. For specific advice
    on goals and management, see published guidelines, such as those of the National High Blood Pressure
    Education Program’s Joint National Committee on Prevention, Detection, Evaluation, and Treatment of
    High Blood Pressure (JNC). Numerous antihypertensive drugs, from a variety of pharmacologic classes
    and with different mechanisms of action, have been shown in randomized controlled trials to reduce
    cardiovascular morbidity and mortality, and it can be concluded that it is blood pressure reduction,
    and not some other pharmacologic property of the drugs, that is largely responsible for those benefits.
    The largest and most consistent cardiovascular outcome benefit has been a reduction in the risk of
    stroke, but reductions in myocardial infarction and cardiovascular mortality also have been seen regularly.
    Elevated systolic or diastolic pressure causes increased cardiovascular risk, and the absolute risk
    increase per mmHg is greater at higher blood pressures, so that even modest reductions of severe hypertension
    can provide substantial benefit. Relative risk reduction from blood pressure reduction is similar
    across populations with varying absolute risk, so the absolute benefit is greater in patients who
    are at higher risk independent of their hypertension (for example, patients with diabetes or hyperlipidemia),
    and such patients would be expected to benefit from more aggressive treatment to a lower blood pressure
    goal. Some antihypertensive drugs have smaller blood pressure effects (as monotherapy) in black patients,
    and many antihypertensive drugs have additional approved indications and effects (e.g., on angina,
    heart failure, or diabetic kidney disease). These considerations may guide selection of therapy. Amlodipine
    may be used alone or in combination with other antihypertensive agents. Coronary Artery Disease (CAD)
    Chronic Stable Angina Amlodipine is indicated for the symptomatic treatment of chronic stable angina.
    Amlodipine may be used alone or in combination with other antianginal agents. Vasospastic Angina (Prinzmetal’s
    or Variant Angina) Amlodipine is indicated for the treatment of confirmed or suspected vasospastic
    angina. Amlodipine may be used as monotherapy or in combination with other antianginal agents. Angiographically
    Documented CAD In patients with recently documented CAD by angiography and without heart failure or
    an ejection fraction < 40%, amlodipine is indicated to reduce the risk of hospitalization for angina
    and to reduce the risk of a coronary revascularization procedure. Atorvastatin Atorvastatin is indicated:
    • To reduce the risk of: o Myocardial infarction (MI), stroke, revascularization procedures, and angina
    in adults with multiple risk factors for coronary heart disease (CHD) but without clinically evident
    CHD o MI and stroke in adults with type 2 diabetes mellitus with multiple risk factors for CHD but
    without clinically evident CHD o Non-fatal MI, fatal and non-fatal stroke, revascularization procedures,
    hospitalization for congestive heart failure, and angina in adults with clinically evident CHD • As
    an adjunct to diet to reduce low-density lipoprotein cholesterol (LDL-C) in: o Adults with primary
    hyperlipidemia. o Adults and pediatric patients aged 10 years and older with heterozygous familial
    hypercholesterolemia (HeFH). • As an adjunct to other LDL-C-lowering therapies, or alone if such treatments
    are unavailable, to reduce LDL C in adults and pediatric patients aged 10 years and older with homozygous
    familial hypercholesterolemia (HoFH). • As an adjunct to diet for the treatment of adults with: o
    Primary dysbetalipoproteinemia o Hypertriglyceridemia'
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - • Acute liver failure or decompensated cirrhosis [see Warnings and Precautions (5.3) ] . • Hypersensitivity
    to amlodipine, atorvastatin or any excipients in ‎CADUET. Hypersensitivity reactions, including anaphylaxis,
    angioneurotic edema, erythema multiforme, Stevens-Johnson syndrome, and toxic epidermal necrolysis,
    have been reported [see Adverse Reactions (6.2) ] .
  - • Acute liver failure or decompensated cirrhosis ( 4 ). • Hypersensitivity to amlodipine, atorvastatin
    or any excipient in CADUET ( 4 ).
