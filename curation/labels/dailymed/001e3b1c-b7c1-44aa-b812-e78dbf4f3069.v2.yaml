title: Ipratropium Bromide and Albuterol Sulfate
product_name: Ipratropium Bromide and Albuterol Sulfate
active_moieties:
- ALBUTEROL
- IPRATROPIUM
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE Ipratropium Bromide and Albuterol Sulfate Inhalation Solution is indicated for
    the treatment of bronchospasm associated with COPD in patients requiring more than one bronchodilator.
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS Ipratropium Bromide and Albuterol Sulfate Inhalation Solution is contraindicated
    in patients with a history of hypersensitivity to any of its components, or to atropine and its derivatives.
