title: 'These highlights do not include all the information needed to use DICLOFENAC SODIUM AND MISOPROSTOL
  DELAYED-RELEASE TABLETS safely and effectively. See full prescribing information for DICLOFENAC SODIUM
  AND MISOPROSTOL DELAYED-RELEASE TABLETS. DICLOFENAC SODIUM and MISOPROSTOL delayed-release tablets,
  for oral use Initial U.S. Approval: 1997'
product_name: Diclofenac Sodium and Misoprostol
active_moieties:
- DICLOFENAC
- MISOPROSTOL
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - Diclofenac sodium and misoprostol delayed-release tablets are indicated for treatment of the signs
    and symptoms of osteoarthritis or rheumatoid arthritis in adult patients at high risk of developing
    NSAID-induced gastric and duodenal ulcers and their complications. For a list of factors that may
    increase the risk of NSAID-induced gastric and duodenal ulcers and their complications [see Warnings
    and Precautions (5.3) ].
  - Diclofenac sodium and misoprostol delayed-release tablets are a combination of diclofenac sodium,
    a non-steroidal anti-inflammatory drug, and misoprostol, a prostaglandin-1 (PGE1) analog, indicated
    for treatment of the signs and symptoms of osteoarthritis or rheumatoid arthritis in adult patients
    at high risk of developing NSAID-induced gastric and duodenal ulcers and their complications. ( 1
    )
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Diclofenac sodium and misoprostol delayed-Release tablets are contraindicated in the following patients:
    Pregnancy. Use of misoprostol, a component of diclofenac sodium and misoprostol delayed-release tablets,
    during pregnancy can result in maternal and fetal harm, including uterine rupture, abortion, premature
    birth, or birth defects [see Warnings and Precautions (5.1) and Use in Specific Populations (8.1)
    ] In the setting of coronary artery bypass graft (CABG) surgery [see Warnings and Precautions (5.2)
    ] Active gastrointestinal bleeding [see Warnings and Precautions (5.3) ] History of asthma, urticaria,
    or other allergic-type reactions after taking aspirin or other NSAIDs. Severe, sometimes fatal, anaphylactic
    reactions to NSAIDs have been reported in such patients [see Warnings and Precautions ( 5.8 , 5.9
    )] Known hypersensitivity (e.g., anaphylactic reactions and serious skin reactions) to diclofenac
    sodium and misoprostol, other prostaglandins, or any components of the drug product [see Warnings
    and Precautions ( 5.8 , 5.10 )]'
  - Pregnancy ( 4 ) In the setting of CABG surgery ( 4 ) Active gastrointestinal bleeding ( 4 ) History
    of asthma, urticaria, or other allergic-type reactions after taking aspirin or other NSAIDs ( 4 )
    Known hypersensitivity to diclofenac sodium, misoprostol, or any components of the drug product (
    4 )
