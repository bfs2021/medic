title: Glipizide and Metformin Hydrochloride Tablets, USP Rx only
product_name: Glipizide and Metformin Hydrochloride
active_moieties:
- GLIPIZIDE
- METFORMIN
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - Glipizide and metformin hydrochloride tablets USP are indicated as an adjunct to diet and exercise
    to improve glycemic control in adults with type 2 diabetes mellitus.
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - 'Glipizide and metformin hydrochloride tablets are contraindicated in patients with: Renal disease
    or renal dysfunction (e.g., as suggested by serum creatinine levels ≥ 1.5 mg/dL [males], ≥ 1.4 mg/dL
    [females], or abnormal creatinine clearance) which may also result from conditions such as cardiovascular
    collapse (shock), acute myocardial infarction, and septicemia (see WARNINGS and PRECAUTIONS ). Known
    hypersensitivity to glipizide or metformin hydrochloride. Acute or chronic metabolic acidosis, including
    diabetic ketoacidosis, with or without coma. Diabetic ketoacidosis should be treated with insulin.'
