sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - Sprintec ® (norgestimate and ethinyl estradiol tablets) is an estrogen/progestin COC, indicated for
    use by women to prevent pregnancy. ()
  - 1.1 Oral Contraceptive
  - Sprintec ® (norgestimate and ethinyl estradiol tablets) is indicated for use by females of reproductive
    potential to prevent pregnancy [see Clinical Studies ()].
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Sprintec is contraindicated in females who are known to have or develop the following conditions:
    • A high risk of arterial or venous thrombotic diseases. Examples include women who are known to:
    o Smoke, if over age 35 [see and Warnings and Precautions ()] o Have deep vein thrombosis or pulmonary
    embolism, now or in the past [see Warnings and Precautions ()] o Have inherited or acquired hypercoagulopathies
    [see Warnings and Precautions ()] o Have cerebrovascular disease [see Warnings and Precautions ()]
    o Have coronary artery disease [see Warnings and Precautions ()] o Have thrombogenic valvular or thrombogenic
    rhythm diseases of the heart (for example, subacute bacterial endocarditis with valvular disease,
    or atrial fibrillation) [see Warnings and Precautions ()] o Have uncontrolled hypertension [see Warnings
    and Precautions ()] o Have diabetes mellitus with vascular disease [see Warnings and Precautions ()]
    o Have headaches with focal neurological symptoms or migraine headaches with aura [see Warnings and
    Precautions ()] ▪ Women over age 35 with any migraine headaches [see Warnings and Precautions ()]
    • Liver tumors, benign or malignant, or liver disease [see Warnings and Precautions ()] • Undiagnosed
    abnormal uterine bleeding [see Warnings and Precautions ()] • Pregnancy, because there is no reason
    to use COCs during pregnancy [see Warnings and Precautions ( ) and Use in Specific Populations ( )]
    • Current diagnosis of, or history of, breast cancer, which may be hormone-sensitive [see Warnings
    and Precautions ()] • Use of Hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir,
    with or without dasabuvir, due to the potential for ALT elevations [see Warnings and Precautions ()]'
  - • A high risk of arterial or venous thrombotic diseases ( 4 ) • Liver tumors or liver disease ( 4
