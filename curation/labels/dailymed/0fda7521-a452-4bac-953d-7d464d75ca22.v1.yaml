title: Chlordiazepoxide Hydrochloride and Clidinium Bromide Capsules, USP for oral use Rx only
product_name: Chlordiazepoxide Hydrochloride and Clidinium Bromide
active_moieties:
- CHLORDIAZEPOXIDE
- CLIDINIUM
sections:
  INDICATIONS:
  - 'INDICATIONS AND USAGE:'
  - Chlordiazepoxide hydrochloride and clidinium bromide capsules are indicated to control emotional and
    somatic factors in gastrointestinal disorders. Chlordiazepoxide hydrochloride and clidinium bromide
    capsules may also be used as adjunctive therapy in the treatment of peptic ulcer and in the treatment
    of the irritable bowel syndrome (irritable colon, spastic colon, mucous colitis) and acute enterocolitis.
  CONTRAINDICATIONS:
  - 'CONTRAINDICATIONS:'
  - Chlordiazepoxide hydrochloride and clidinium bromide capsules are contraindicated in the presence
    of glaucoma (since the anticholinergic component may produce some degree of mydriasis) and in patients
    with prostatic hypertrophy and benign bladder neck obstruction. It is contraindicated in patients
    with known hypersensitivity to chlordiazepoxide hydrochloride and/or clidinium bromide.
