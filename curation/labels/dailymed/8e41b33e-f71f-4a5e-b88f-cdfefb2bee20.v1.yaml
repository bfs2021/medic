title: Orphenadrine Citrate, Aspirin and Caffeine Tablets
product_name: Orphenadrine Citrate, Aspirin and Caffeine
active_moieties:
- ASPIRIN
- CAFFEINE
- ORPHENADRINE
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - Symptomatic relief of mild to moderate pain of acute musculoskeletal disorders. The orphenadrine component
    is indicated as an adjunct to rest, physical therapy, and other measures for the relief of discomfort
    associated with acute painful musculoskeletal conditions. The mode of action of orphenadrine has not
    been clearly identified, but may be related to its analgesic properties. Orphenadrine Citrate, Aspirin,
    and Caffeine Tablets do not directly relax tense skeletal muscles in man.
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - Because of the mild anti-cholinergic effect of orphenadrine, Orphenadrine Citrate, Aspirin, and Caffeine
    Tablets should not be used in patients with glaucoma, pyloric or duodenal obstruction, achalasia,
    prostatic hypertrophy, or obstructions at the bladder neck. Orphenadrine Citrate, Aspirin, and Caffeine
    Tablets are also contraindicated in patients with myasthenia gravis and in patients known to be sensitive
    to aspirin or caffeine. The drug is contraindicated in patients who have demonstrated a previous hypersensitivity
    to the drug.
