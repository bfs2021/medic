title: 'These highlights do not include all the information needed to use ESTRADIOL AND NORETHINDRONE
  ACETATE TABLETS safely and effectively. See full prescribing information for ESTRADIOL AND NORETHINDRONE
  ACETATE TABLETS. ESTRADIOL and NORETHINDRONE ACETATE tablets, for oral use Initial U.S. Approval: 1998'
product_name: Estradiol and Norethindrone Acetate
active_moieties:
- ESTRADIOL
- NORETHINDRONE
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'Estradiol and norethindrone acetate tablets are an estrogen and progestin combination indicated in
    a woman with a uterus for: Treatment of Moderate to Severe Vasomotor Symptoms due to Menopause ( 1.1
    ) Treatment of Moderate to Severe Symptoms of Vulvar and Vaginal Atrophy due to Menopause ( 1.2 )
    Limitations of Use: When prescribing solely for the treatment of moderate to severe symptoms of vulvar
    and vaginal atrophy due to menopause, first consider the use of topical vaginal products. Prevention
    of Postmenopausal Osteoporosis ( 1.3 ) Limitations of Use: When prescribing solely for the prevention
    of postmenopausal osteoporosis, first consider the use of non-estrogen medications. Consider estrogen
    therapy only for women at significant risk of osteoporosis.'
  - 'Estradiol and norethindrone acetate tablets are indicated for:'
  - 1.1 Treatment of Moderate to Severe Vasomotor Symptoms due to Menopause
  - 1.2 Treatment of Moderate to Severe Symptoms of Vulvar and Vaginal Atrophy due to Menopause
  - Limitation of Use When prescribing solely for the treatment of moderate to severe symptoms of vulvar
    and vaginal atrophy due to menopause, first consider the use of topical vaginal products.
  - 1.3 Prevention of Postmenopausal Osteoporosis
  - Limitation of Use When prescribing solely for the prevention of postmenopausal osteoporosis, first
    consider the use of non-estrogen medications. Consider estrogen therapy only for women at significant
    risk of osteoporosis.
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - Undiagnosed abnormal genital bleeding ( 4 ) Breast cancer or a history of breast cancer ( 4 , 5.2
    ) Estrogen-dependent neoplasia ( 4 , 5.2 ) Active DVT, PE, or history of these conditions ( 4 , 5.1
    ) Active arterial thromboembolic disease (for example, stroke and MI), or a history of these conditions
    ( 4 , 5.1 ) Known anaphylactic reaction, angioedema, or hypersensitivity to estradiol and norethindrone
    acetate tablets ( 4 ) Hepatic impairment or disease ( 4 , 5.10 ) Protein C, protein S, or antithrombin
    deficiency, or other known thrombophilic disorders ( 4 )
  - 'Estradiol and norethindrone acetate tablets are contraindicated in women with any of the following
    conditions: • Undiagnosed abnormal genital bleeding [ see Warnings and Precautions ( 5.2 ) ] • Breast
    cancer or history of breast cancer [ see Warnings and Precautions ( 5.2 ) ] • Estrogen-dependent neoplasia
    [ see Warnings and Precautions ( 5.2 ) ] • Active DVT, PE, or history of these conditions [ see Warnings
    and Precautions ( 5.1 ) ] • Active arterial thromboembolic disease (for example, stroke and MI), or
    a history of these conditions [ see Warnings and Precautions ( 5.1 ) ] • Known anaphylactic reaction,
    angioedema, or hypersensitivity to estradiol and norethindrone acetate tablets • Hepatic impairment
    or disease • Protein C, protein S, or antithrombin deficiency, or other known thrombophilic disorders'
