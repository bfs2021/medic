title: ACTOPLUS MET® (pioglitazone hydrochloride and metformin hydrochloride) tablets
product_name: Actoplus Met
active_moieties:
- METFORMIN
- PIOGLITAZONE
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - ACTOPLUS MET is a thiazolidinedione and biguanide combination product indicated as an adjunct to diet
    and exercise to improve glycemic control in adults with type 2 diabetes mellitus who are already treated
    with a thiazolidinedione and metformin or who have inadequate glycemic control on a thiazolidinedione
    alone or metformin alone.
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - 'Initiation of ACTOPLUS MET in patients with established New York Heart Association (NYHA) Class III
    or IV heart failure is contraindicated (see BOXED WARNING ). In addition, ACTOPLUS MET is contraindicated
    in patients with: Renal disease or renal dysfunction (e.g., as suggested by serum creatinine levels
    ≥ 1.5 mg/dL [males], ≥ 1.4 mg/dL [females], or abnormal creatinine clearance) which may also result
    from conditions such as cardiovascular collapse (shock), acute myocardial infarction, and septicemia
    (see WARNINGS, Metformin hydrochloride and PRECAUTIONS, General: Metformin hydrochloride ). Known
    hypersensitivity to pioglitazone, metformin or any other component of ACTOPLUS MET. Acute or chronic
    metabolic acidosis, including diabetic ketoacidosis, with or without coma. Diabetic ketoacidosis should
    be treated with insulin. ACTOPLUS MET should be temporarily discontinued in patients undergoing radiologic
    studies involving intravascular administration of iodinated contrast materials, because use of such
    products may result in acute alteration of renal function (see PRECAUTIONS, General: Metformin hydrochloride
    ).'
