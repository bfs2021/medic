  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - Valsartan and hydrochlorothiazide tablets are contraindicated in patients who are hypersensitive to
    any component of this product. Because of the hydrochlorothiazide component, this product is contraindicated
    in patients with anuria or hypersensitivity to other sulfonamide-derived drugs. Do not coadminister
    aliskiren with valsartan and hydrochlorothiazide tablets in patients with diabetes [see Drug Interactions
    ( )].
  - Anuria; Hypersensitivity to any sulfonamide-derived drugs or any component; Do not coadminister aliskiren
    with valsartan and hydrochlorothiazide tablets in patients with diabetes ()
