title: 'These highlights do not include all the information needed to use NAPROXEN AND ESOMEPRAZOLE MAGNESIUM
  DELAYED-RELEASE TABLETS safely and effectively. See full prescribing information for NAPROXEN AND ESOMEPRAZOLE
  MAGNESIUM DELAYED-RELEASE TABLETS. NAPROXEN AND ESOMEPRAZOLE MAGNESIUM delayed-release tablets, for
  oral use Initial U.S. Approval: 2010'
product_name: Naproxen and esomeprazole magnesium
active_moieties:
- ESOMEPRAZOLE
- NAPROXEN
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'Naproxen and esomeprazole magnesium delayed-release tablets, a combination of naproxen and esomeprazole
    magnesium, is indicated in adult and adolescent patients 12 years of age and older weighing at least
    38 kg, requiring naproxen for symptomatic relief of arthritis and esomeprazole magnesium to decrease
    the risk for developing naproxen-associated gastric ulcers. The naproxen component of naproxen and
    esomeprazole magnesium delayed-release tablet is indicated for relief of signs and symptoms of: •
    osteoarthritis, rheumatoid arthritis and ankylosing spondylitis in adults. • juvenile idiopathic arthritis
    (JIA) in adolescent patients. The esomeprazole magnesium component of naproxen and esomeprazole magnesium
    delayed-release tablet is indicated to decrease the risk of developing naproxen-associated gastric
    ulcers. Limitations of Use : • Do not substitute naproxen and esomeprazole magnesium delayed-release
    tablet with the single-ingredient products of naproxen and esomeprazole magnesium. • Naproxen and
    esomeprazole magnesium delayed-release tablets are not recommended for initial treatment of acute
    pain because the absorption of naproxen is delayed compared to absorption from other naproxen-containing
    products. • Controlled studies do not extend beyond 6 months [see Use in Specific Populations ( 8.4
    ), Clinical Studies ( 14 )] .'
  - 'Naproxen and esomeprazole magnesium delayed-release tablets are a combination of naproxen, a non-steroidal
    anti-inflammatory drug (NSAID), and esomeprazole magnesium, a proton pump inhibitor (PPI) indicated
    in adult and adolescent patients 12 years of age and older weighing at least 38 kg, requiring naproxen
    for symptomatic relief of arthritis and esomeprazole magnesium to decrease the risk of developing
    naproxen-­associated gastric ulcers. The naproxen component of naproxen and esomeprazole magnesium
    delayed-release tablet is indicated for relief of signs and symptoms of: osteoarthritis, rheumatoid
    arthritis and ankylosing spondylitis in adults. juvenile idiopathic arthritis (JIA) in adolescent
    patients. The esomeprazole magnesium component of naproxen and esomeprazole magnesium delayed-release
    tablet is indicated to decrease the risk of developing naproxen-associated gastric ulcers. ( 1 ) Limitations
    of Use: Do not substitute naproxen and esomeprazole magnesium delayed-release tablets with the single-ingredient
    products of naproxen and esomeprazole magnesium. ( 1 ) Naproxen and esomeprazole magnesium delayed-release
    tablets are not recommended for initial treatment of acute pain because the absorption of naproxen
    is delayed compared to absorption from other naproxen-containing products. ( 1 ) Controlled studies
    do not extend beyond 6 months. ( 1 )'
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Naproxen and esomeprazole magnesium delayed-release tablets are contraindicated in the following
    patients: • Known hypersensitivity (e.g., anaphylactic reactions and serious skin reactions) to naproxen,
    esomeprazole magnesium, substituted benzimidazoles, or to any components of the drug product, including
    omeprazole. Hypersensitivity reactions to esomeprazole may include anaphylaxis, anaphylactic shock,
    angioedema, bronchospasm, acute tubulointerstitial nephritis, and urticaria [see Warnings and Precautions
    ( 5.7 , 5.8 , 5.9 , 5.18 ), Adverse Reactions ( 6.2 )]. • History of asthma, urticaria, or allergic-type
    reactions after taking aspirin or other NSAIDs. Severe, sometimes fatal, anaphylactic reactions to
    NSAIDs have been reported in such patients [see Warnings and Precautions ( 5.7 , 5.8 ) ]. • In the
    setting of coronary artery bypass graft (CABG) surgery [see Warnings and Precautions (5.1) ]. • Proton
    pump inhibitors (PPIs), including esomeprazole magnesium, are contraindicated in patients receiving
    rilpivirine-containing products [see Drug Interactions ( 7 ) ].'
  - Known hypersensitivity to naproxen, esomeprazole magnesium, substituted benzimidazoles, or to any
    components of the drug product including omeprazole. (4 ) History of asthma, urticaria, or other allergic-type
