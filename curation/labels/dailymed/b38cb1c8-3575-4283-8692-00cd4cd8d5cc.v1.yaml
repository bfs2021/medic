title: Perrigo All Day Allergy-D Drug Facts
product_name: All Day Allergy D
active_moieties:
- CETIRIZINE
- PSEUDOEPHEDRINE
sections:
  INDICATIONS:
  - Uses
  - '• temporarily relieves these symptoms due to hay fever or other upper respiratory allergies: • runny
    nose • sneezing • itchy, watery eyes • itching of the nose or throat • nasal congestion • reduces
    swelling of nasal passages • temporarily relieves sinus congestion and pressure • temporarily restores
    freer breathing through the nose'
  CONTRAINDICATIONS:
  - Do not use
  - • if you have ever had an allergic reaction to this product or any of its ingredients or to an antihistamine
    containing hydroxyzine. • if you are now taking a prescription monoamine oxidase inhibitor (MAOI)
    (certain drugs for depression, psychiatric, or emotional conditions, or Parkinson’s disease), or for
    2 weeks after stopping the MAOI drug. If you do not know if your prescription drug contains an MAOI,
    ask a doctor or pharmacist before taking this product.
