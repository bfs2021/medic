product_name: ezetimibe and simvastatin
active_moieties:
- EZETIMIBE
- SIMVASTATIN
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'Ezetimibe and Simvastatin Tablets Ezetimibe and Simvastatin Tablets are a combination of simvastatin
    and ezetimibe indicated: • As an adjunct to diet to reduce elevated low density lipoprotein cholesterol
    (LDL-C): • In adults with primary hyperlipidemia. • In adults and pediatric patients aged 10 years
    and older with heterozygous familial hypercholesterolemia (HeFH). • As an adjunct to other LDL-C-lowering
    therapies to reduce elevated LDL-C in adults with homozygous familial hypercholesterolemia (HoFH).
    Simvastatin Simvastatin, when used as a component of ezetimibe and simvastatin tablets, is indicated
    to reduce the risk of total mortality by reducing risk of coronary heart disease death, non-fatal
    myocardial infarction and stroke, and the need for coronary and non-coronary revascularization procedures
    in adults with established coronary heart disease, cerebrovascular disease, peripheral vascular disease,
    and/or diabetes, who are at high risk of coronary heart disease events.'
  - 'Ezetimibe and simvastatin tablets are a combination of ezetimibe, a dietary cholesterol absorption
    inhibitor, and simvastatin, an HMG-CoA reductase inhibitor (statin) indicated: ( 1 ) • As an adjunct
    to diet to reduce elevated low density lipoprotein cholesterol (LDL-C): • In adults with primary hyperlipidemia.
    • In adults and pediatric patients aged 10 years and older with heterozygous familial hypercholesterolemia
    (HeFH). • As an adjunct to other LDL-C lowering therapies to reduce LDL-C in adults with homozygous
    familial hypercholesterolemia (HoFH). Simvastatin Simvastatin, when used as a component of ezetimibe
    and simvastatin tablets, is indicated to reduce the risk of total mortality by reducing risk of coronary
    heart disease death, non-fatal myocardial infarction and stroke, and the need for coronary and non-coronary
    revascularization procedures in adults with established coronary heart disease, cerebrovascular disease,
    peripheral vascular disease, and/or diabetes, who are at high risk of coronary heart disease events.'
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Ezetimibe and simvastatin tablets are contraindicated in the following conditions: • Concomitant
    use of strong CYP3A4 inhibitors (select azole anti-fungals, macrolide antibiotics, anti-viral medications,
    and nefazodone) [see Drug Interactions ( 7.1 )]. • Concomitant use of cyclosporine, danazol, or danazol
    [see Drug Interactions ( 7.1 )]. • Acute liver failure or decompensated cirrhosis [see Warnings and
    Precautions ( 5.3 )]. • Hypersensitivity to simvastatin, ezetimibe, or any excipients in ezetimibe
    and simvastatin tablets. Hypersensitivity reactions, including anaphylaxis, angioedema, and Stevens-Johnson
    syndrome, have been reported [see Adverse Reactions ( 6.2 )].'
  - • Concomitant use of strong CYP3A4 inhibitors (select azole anti-fungals, macrolide antibiotics, anti-viral
    medications and nefazodone). ( 4 ) • Concomitant use of cyclosporine, danazol or gemfibrozil. ( 4
    ) • Acute liver failure or decompensated cirrhosis. ( 4 ) • Hypersensitivity to simvastatin, ezetimibe
    or any excipient of ezetimibe and simvastatin tablets. ( 4)
