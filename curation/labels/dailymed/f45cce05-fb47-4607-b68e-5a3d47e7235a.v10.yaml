title: 'These highlights do not include all the information needed to use DORZOLAMIDE HYDROCHLORIDE AND
  TIMOLOL MALEATE OPHTHALMIC SOLUTION safely and effectively. See full prescribing information for DORZOLAMIDE
  HYDROCHLORIDE AND TIMOLOL MALEATE OPHTHALMIC SOLUTION. DORZOLAMIDE HYDROCHLORIDE AND TIMOLOL MALEATE
  ophthalmic solution Initial U.S. Approval: 1998'
product_name: Dorzolamide Hydrochloride and Timolol Maleate ophthalmic Solution
active_moieties:
- DORZOLAMIDE
- TIMOLOL ANHYDROUS
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - Dorzolamide hydrochloride and timolol maleate ophthalmic solution is indicated for the reduction of
    elevated intraocular pressure (IOP) in patients with open-angle glaucoma or ocular hypertension who
    are insufficiently responsive to beta-blockers (failed to achieve target IOP determined after multiple
    measurements over time). The IOP-lowering of dorzolamide hydrochloride and timolol maleate ophthalmic
    solution administered twice a day was slightly less than that seen with the concomitant administration
    of 0.5% timolol administered twice a day and 2% dorzolamide administered three times a day [see Clinical
    Studies (14) ].
  - Dorzolamide hydrochloride and timolol maleate ophthalmic solution is a combination of dorzolamide
    hydrochloride, a carbonic anhydrase inhibitor, and timolol maleate, a beta­ adrenergic receptor blocking
    agent, indicated for the reduction of elevated intraocular pressure (IOP) in patients with open-angle
    glaucoma or ocular hypertension who are insufficiently responsive to beta-blockers. The IOP-lowering
    of dorzolamide hydrochloride and timolol maleate ophthalmic solution twice daily was slightly less
    than that seen with the concomitant administration of 0.5% timolol twice daily, and 2% dorzolamide
    three times daily. ( 1 )
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Dorzolamide hydrochloride and timolol maleate ophthalmic solution is contraindicated in patients
    with: Bronchial asthma or a history of bronchial asthma, severe chronic obstructive pulmonary disease.(
    4.1 ) Sinus bradycardia, second or third degree atrioventricular block, overt cardiac failure, cardiogenic
    shock. ( 4.2 ) Hypersensitivity to any component of this product. ( 4.3 , 5.3 )'
  - 4.1 Asthma, COPD
  - Dorzolamide hydrochloride and timolol maleate ophthalmic solution is contraindicated in patients with
    bronchial asthma, a history of bronchial asthma, or severe chronic obstructive pulmonary disease [see
    Warnings and Precautions (5.1) ] .
  - 4.2 Sinus Bradycardia, AV Block, Cardiac Failure, Cardiogenic Shock
  - Dorzolamide hydrochloride and timolol maleate ophthalmic solution is contraindicated in patients with
    sinus bradycardia, second or third degree atrioventricular block, overt cardiac failure, and cardiogenic
    shock [see Warnings and Precautions (5.2) ] .
  - 4.3 Hypersensitivity
  - Dorzolamide hydrochloride and timolol maleate ophthalmic solution is contraindicated in patients who
    are hypersensitive to any component of this product [see Warnings and Precautions (5.3) ] .
