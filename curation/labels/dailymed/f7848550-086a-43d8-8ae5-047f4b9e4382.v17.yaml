title: 'These highlights do not include all the information needed to use XULANE® safely and effectively.
  See full prescribing information for XULANE. XULANE® (norelgestromin and ethinyl estradiol transdermal
  system)Initial U.S. Approval: 2001'
product_name: XULANE
active_moieties:
- ETHINYL ESTRADIOL
- NORELGESTROMIN
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'Xulane is indicated for the prevention of pregnancy in women with a body mass index (BMI) < 30 kg/m
    2 for whom a combined hormonal contraceptive is appropriate. Limitations of Use: Xulane may be less
    effective in preventing pregnancy in women who weigh 198 lbs. (90 kg) or more. Xulane is contraindicated
    for use in women with BMI ≥ 30 kg/m 2 [see Contraindications (4) , Warnings and Precautions (5.1)
    and Clinical Studies (14) ] .'
  - 'Xulane is an estrogen/progestin combination hormonal contraceptive (CHC), indicated for the prevention
    of pregnancy in women with a BMI < 30 kg/m 2 for whom a combined hormonal contraceptive is appropriate.
    ( 1 ) Limitations of Use: Xulane may be less effective in preventing pregnancy in women at or above
    198 lbs. (90 kg). ( 1 , 4 , 14 )'
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Xulane is contraindicated in females who are known to have or develop the following conditions: •
    At high risk of arterial or venous thromboembolic events. Examples include women who: o Smoke, if
    over age 35 [see Boxed Warning , and Warnings and Precautions (5.1) ] o Have deep vein thrombosis
    or pulmonary embolism, now or in the past [see Warnings and Precautions (5.1) ] o Have inherited or
    acquired hypercoagulopathies [see Warnings and Precautions (5.1) ] o Have cerebrovascular disease
    [see Warnings and Precautions (5.1) ] o Have coronary artery disease [see Warnings and Precautions
    (5.1) ] o Have thrombogenic valvular or thrombogenic rhythm diseases of the heart (for example, subacute
    bacterial endocarditis with valvular disease, or atrial fibrillation) [see Warnings and Precautions
    (5.1) ] o Have uncontrolled hypertension [see Warnings and Precautions (5.5) ] o Have diabetes mellitus
    with vascular disease [see Warnings and Precautions (5.7) ] o Have headaches with focal neurological
    symptoms or have migraine headaches with aura ▪ Women over age 35 with any migraine headaches [see
    Warnings and Precautions (5.8) ] • Body Mass Index ≥ 30 kg/m 2 [see Warnings and Precautions (5.1)
    ] • Liver tumors, benign or malignant, or liver disease [see Warnings and Precautions (5.3) , Use
    in Specific Populations (8.6) and Clinical Pharmacology (12.3) ] • Undiagnosed abnormal uterine bleeding
    [see Warnings and Precautions (5.9) ] • Pregnancy, because there is no reason to use hormonal contraceptives
    during pregnancy [see Warnings and Precautions (5.10) and Use in Specific Populations (8.1) ] • Current
    diagnosis of, or history of, breast cancer, which may be hormone-sensitive [See Warnings and Precautions
    (5.12) ] • Use of Hepatitis C drug combinations containing ombitasvir/paritaprevir/ritonavir, with
    or without dasabuvir, due to the potential for alanine aminotransferase (ALT) elevations [see Warnings
    and Precautions (5.4) ]'
  - • At high risk of arterial or venous thromboembolic events ( 4 ) • BMI ≥ 30 kg/m 2 ( 4 ) • Breast
    cancer or other estrogen- or progestin-sensitive cancer ( 4 ) • Liver tumors or liver disease ( 4
    ) • Undiagnosed abnormal uterine bleeding ( 4 ) • Pregnancy ( 4 ) • Co-administration with Hepatitis
    C drug combinations containing ombitasvir/paritaprevir/ritonavir, with or without dasabuvir ( 4 )
