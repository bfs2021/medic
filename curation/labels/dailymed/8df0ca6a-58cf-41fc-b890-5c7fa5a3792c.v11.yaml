  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - Do not use aliskiren with ARBs or ACEIs in patients with diabetes [see Warnings and Precautions (
    5.2 ) and Clinical Studies ( 14.4 )]. Tekturna HCT is contraindicated in patients with known anuria
    or hypersensitivity to sulfonamide-derived drugs like HCTZ or to any of the components [see Warnings
    and Precautions ( 5.6 ) and Adverse Reactions ( 6.1 )] . Hypersensitivity reactions may range from
    urticaria to anaphylaxis.
  - Do not use with angiotensin receptor blockers (ARBs) or angiotensin- converting enzyme inhibitors
    (ACEIs) in patients with diabetes. ( 4 ) Anuria ( 4 ) Hypersensitivity to sulfonamide-derived drugs
    or to any of the components. ( 4 )
