title: CVS 44-615-Delisted
product_name: Congestion and Headache
active_moieties:
- ACETAMINOPHEN
- GUAIFENESIN
- PHENYLEPHRINE
sections:
  INDICATIONS:
  - Uses
  - 'temporarily relieves these common cold and flu symptoms: nasal congestion headache minor aches and
    pains sinus congestion and pressure helps loosen phlegm (mucus) and thin bronchial secretions to rid
    the bronchial passageways of bothersome mucus and make coughs more productive temporarily reduces
    fever temporarily promotes nasal and/or sinus drainage'
  CONTRAINDICATIONS:
  - Do not use
  - with any other drug containing acetaminophen (prescription or nonprescription). If you are not sure
    whether a drug contains acetaminophen, ask a doctor or pharmacist. if you are now taking a prescription
    monoamine oxidase inhibitor (MAOI) (certain drugs for depression, psychiatric, or emotional conditions,
    or Parkinson’s disease), or for 2 weeks after stopping the MAOI drug. If you do not know if your prescription
    drug contains an MAOI, ask a doctor or pharmacist before taking this product. if you have ever had
    an allergic reaction to this product or any of its ingredients
