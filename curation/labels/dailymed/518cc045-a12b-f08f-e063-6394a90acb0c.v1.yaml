title: Sulfamethoxazole and Trimethoprim Tablets, USP
product_name: Sulfamethoxazole and Trimethoprim
active_moieties:
- SULFAMETHOXAZOLE
- TRIMETHOPRIM
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - To reduce the development of drug-resistant bacteria and maintain the effectiveness of sulfamethoxazole
    and trimethoprim tablets and other antibacterial drugs, sulfamethoxazole and trimethoprim tablets
    should be used only to treat or prevent infections that are proven or strongly suspected to be caused
    by susceptible bacteria. When culture and susceptibility information are available, they should be
    considered in selecting or modifying antibacterial therapy. In the absence of such data, local epidemiology
    and susceptibility patterns may contribute to empiric selection of therapy.
  - Urinary Tract Infections
  - 'For the treatment of urinary tract infections due to susceptible strains of the following organisms:
    Escherichia coli, Klebsiella species, Enterobacter species, Morganella morganii, Proteus mirabilis
    and Proteus vulgaris. It is recommended that initial episodes of uncomplicated urinary tract infections
    be treated with a single effective antibacterial agent rather than the combination.'
  - Acute Otitis Media
  - For the treatment of acute otitis media in pediatric patients due to susceptible strains of Streptococcus
    pneumoniae or Haemophilus influenzae when in the judgment of the physician sulfamethoxazole and trimethoprim
    offers some advantage over the use of other antimicrobial agents. To date, there are limited data
    on the safety of repeated use of sulfamethoxazole and trimethoprim tablets in pediatric patients under
    two years of age. Sulfamethoxazole and trimethoprim tablets are not indicated for prophylactic or
    prolonged administration in otitis media at any age.
  - Acute Exacerbations of Chronic Bronchitis in Adults
  - For the treatment of acute exacerbations of chronic bronchitis due to susceptible strains of Streptococcus
    pneumoniae or Haemophilus influenzae when a physician deems that sulfamethoxazole and trimethoprim
    tablets could offer some advantage over the use of a single antimicrobial agent.
  - Shigellosis
  - For the treatment of enteritis caused by susceptible strains of Shigella flexneri and Shigella sonnei
    when antibacterial therapy is indicated. Pneumocystis jirovecii Pneumonia For the treatment of documented
    Pneumocystis jirovecii pneumonia and for prophylaxis against P. jirovecii pneumonia in individuals
    who are immunosuppressed and considered to be at an increased risk of developing P. jirovecii pneumonia.
  - Traveler's Diarrhea in Adults
  - For the treatment of traveler’s diarrhea due to susceptible strains of enterotoxigenic E. coli.
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - 'Sulfamethoxazole and trimethoprim tablets are contraindicated in the following situations: known
    hypersensitivity to trimethoprim or sulfonamides history of drug-induced immune thrombocytopenia with
    use of trimethoprim and/or sulfonamides documented megaloblastic anemia due to folate deficiency pediatric
    patients less than 2 months of age marked hepatic damage severe renal insufficiency when renal function
    status cannot be monitored concomitant administration with dofetilide (see PRECAUTIONS ).'
