title: 'These highlights do not include all the information needed to use PREMPRO/PREMPHASE safely and
  effectively. See full prescribing information for PREMPRO/PREMPHASE. PREMPRO® (conjugated estrogens/medroxyprogesterone
  acetate tablets) PREMPHASE® (conjugated estrogens plus medroxyprogesterone acetate tablets)Initial U.S.
  Approval: 1995'
product_name: Prempro
active_moieties:
- ESTROGENS, CONJUGATED
- MEDROXYPROGESTERONE
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'PREMPRO/PREMPHASE is an estrogen/progestin indicated in women with intact uteri for: Treatment of
    Moderate to Severe Vasomotor Symptoms due to Menopause ( 1.1 ) Treatment of Moderate to Severe Vulvar
    and Vaginal Atrophy due to Menopause ( 1.2 ) Prevention of Postmenopausal Osteoporosis ( 1.3 )'
  - 1.1 Treatment of Moderate to Severe Vasomotor Symptoms due to Menopause
  - 1.2 Treatment of Moderate to Severe Vulvar and Vaginal Atrophy due to Menopause
  - 1.3 Prevention of Postmenopausal Osteoporosis
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'PREMPRO or PREMPHASE therapy should not be used in women with any of the following conditions: Undiagnosed
    abnormal genital bleeding Known, suspected, or history of breast cancer Known or suspected estrogen-dependent
    neoplasia Active deep vein thrombosis, pulmonary embolism or a history of these conditions Active
    arterial thromboembolic disease (for example, stroke and myocardial infarction), or a history of these
    conditions Known liver dysfunction or disease Known thrombophilic disorders (e.g., protein C, protein
    S, or antithrombin deficiency) Known or suspected pregnancy'
  - Undiagnosed abnormal genital bleeding ( 4 ) Known, suspected, or history of breast cancer ( 4 , 5.2
    ) Known or suspected estrogen-dependent neoplasia ( 4 , 5.2 ) Active deep vein thrombosis, pulmonary
    embolism or a history of these conditions ( 4 , 5.1 ) Active arterial thromboembolic disease (for
    example, stroke and myocardial infarction) or a history of these conditions ( 4 , 5.1 ) Known liver
    dysfunction or disease ( 4 , 5.10 ) Known thrombophilic disorders (e.g., protein C, protein S, or
