title: Sudafed Sinus 12 Hour Pressure + Pain
product_name: Sudafed Sinus 12 Hour Pressure plus Pain
active_moieties:
- NAPROXEN
- PSEUDOEPHEDRINE
sections:
  INDICATIONS:
  - Uses
  - 'temporarily relieves these cold, sinus, and flu symptoms: sinus pressure minor body aches and pains
    headache nasal and sinus congestion (promotes sinus drainage and restores freer breathing through
    the nose) fever'
  CONTRAINDICATIONS:
  - Do not use
  - if you have ever had an allergic reaction to any other pain reliever/fever reducer right before or
    after heart surgery if you are now taking a prescription monoamine oxidase inhibitor (MAOI) (certain
    drugs for depression, psychiatric, or emotional conditions, or Parkinson's disease), or for 2 weeks
    after stopping the MAOI drug. If you do not know if your prescription drug contains an MAOI, ask a
    doctor or pharmacist before taking this product. in children under 12 years of age
