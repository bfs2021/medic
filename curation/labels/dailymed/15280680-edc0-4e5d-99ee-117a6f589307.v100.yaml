title: Tobramycin and Dexamethasone Ophthalmic Suspension, USP Sterile
product_name: TOBRAMYCIN AND DEXAMETHASONE
active_moieties:
- DEXAMETHASONE
- TOBRAMYCIN
sections:
  INDICATIONS:
  - 'INDICATIONS AND USAGE: Tobramycin and dexamethasone ophthalmic suspension is indicated for steroid-responsive
    inflammatory ocular conditions for which a corticosteroid is indicated and where superficial bacterial
    ocular infection or a risk of bacterial ocular infection exists. Ocular steroids are indicated in
    inflammatory conditions of the palpebral and bulbar conjunctiva, cornea and anterior segment of the
    globe where the inherent risk of steroid use in certain infective conjunctivitides is accepted to
    obtain a diminution in edema and inflammation. They are also indicated in chronic anterior uveitis
    and corneal injury from chemical, radiation or thermal burns, or penetration of foreign bodies. The
    use of a combination drug with an anti-infective component is indicated where the risk of superficial
    ocular infection is high or where there is an expectation that potentially dangerous numbers of bacteria
    will be present in the eye. The particular anti-infective drug in this product is active against the
    following common bacterial eye pathogens: Staphylococci , including S. aureus and S. epidermidis (coagulase-positive
    and coagulase-negative), including penicillin-resistant strains. Streptococci , including some of
    the Group A-beta-hemolytic species, some nonhemolytic species, and some Streptococcus pneumoniae.
    Pseudomonas aeruginosa, Escherichia coli, Klebsiella pneumoniae, Enterobacter aerogenes, Proteus mirabilis,
    Morganella morganii, most Proteus vulgaris strains, Haemophilus influenzae and H. aegyptius, Moraxella
    lacunata, Acinetobacter calcoaceticus and some Neisseria species.'
  CONTRAINDICATIONS:
  - 'CONTRAINDICATIONS: Epithelial herpes simplex keratitis (dendritic keratitis), vaccinia, varicella,
    and many other viral diseases of the cornea and conjunctiva. Mycobacterial infection of the eye. Fungal
    diseases of ocular structures. Hypersensitivity to a component of the medication.'
