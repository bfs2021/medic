title: Esterified Estrogens and Methyltestosterone Tablets, 1.25 mg/2.5 mg Esterified Estrogens and Methyltestosterone
  Tablets, 0.625 mg/1.25 mg (Half-Strength) CIII
product_name: Esterified Estrogens and Methyltestosterone
active_moieties:
- ESTROGENS, ESTERIFIED
- METHYLTESTOSTERONE
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - 'Esterified Estrogens and Methyltestosterone Full and Half-Strength Tablets are indicated in the:
    • Treatment of moderate to severe vasomotor symptoms associated with the menopause in those patients
    not improved by estrogens alone. (There is no evidence that estrogens are effective for nervous symptoms
    or depression without associated vasomotor symptoms, and they should not be used to treat such conditions.)
    • Esterified Estrogens and Methyltestosterone Full and Half-Strength Tablets have not been shown to
    be effective for any purpose during pregnancy and its use may cause severe harm to the fetus.'
  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - 'Esterified Estrogens and Methyltestosterone Full and Half-Strength Tablets should not be used in
    women with any of the following conditions: 1. Undiagnosed abnormal genital bleeding. 2. Known, suspected,
    or history of cancer of the breast. 3. Known or suspected estrogen-dependent neoplasia. 4. Active
    deep vein thrombosis, pulmonary embolism or history of these conditions. 5. Active or recent (e.g.,
    within the past year) arterial thromboembolic disease (e.g., stroke, myocardial infarction). 6. Liver
    dysfunction or disease. 7. Esterified Estrogens and Methyltestosterone Full and Half-Strength Tablets
    should not be used in patients with known hypersensitivity to its ingredients. 8. Known or suspected
    pregnancy. There is no indication for Esterified Estrogens and Methyltestosterone Full and Half-Strength
    Tablets in pregnancy. There appears to be little or no increased risk of birth defects in children
    born to women who have used estrogens and progestins from oral contraceptives inadvertently during
    early pregnancy. (See PRECAUTIONS .) Methyltestosterone should not be used in: 1. The presence of
    severe liver damage. 2. Pregnancy and in breast-feeding mothers because of the possibility of masculinization
    of the female fetus or breast-fed infant.'
