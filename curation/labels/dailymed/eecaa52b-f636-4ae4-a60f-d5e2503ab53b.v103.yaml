product_name: Hydrocodone Polistirex and Chlorpheniramine Polistirexextended-release
active_moieties:
- CHLORPHENIRAMINE
- HYDROCODONE
sections:
  INDICATIONS:
  - 1 INDICATIONS AND USAGE
  - 'Hydrocodone Polistirex and Chlorpheniramine Polistirex Extended-Release Suspension is indicated for
    the temporary relief of cough and upper respiratory symptoms associated with allergy or the common
    cold in patients 18 years of age and older. Important Limitations of Use : • Not indicated for pediatric
    patients under 18 years of age [ see Use in Specific Populations (8.4 ) ]. • Contraindicated in pediatric
    patients less than 6 years of age [ see Contraindications (4) ]. • Because of the risks of addiction,
    abuse, and misuse with opioids, even at recommended doses [ see Warnings and Precautions (5.1) ],
    reserve Hydrocodone Polistirex and Chlorpheniramine Polistirex for use in adult patients for whomthe
    benefits of cough suppression are expected to outweigh the risks, and in whom an adequateassessment
    of the etiology of the cough has been made.'
  - Hydrocodone Polistirex and Chlorpheniramine Polistirex is a combination of hydrocodone, an opioid
    agonist; and chlorpheniramine, a histamine-1 (H1) receptor antagonist, indicated for the temporary
    relief of cough and upper respiratory symptoms associated with allergy or the common cold in patients
    18 years of age and older. ( 1 ) Important Limitations of Use ( 1 ) Not indicated for pediatric patients
    under 18 years of age. Because of the risks of addiction, abuse, and misuse with opioids, even at
    recommended doses, reserve Hydrocodone Polistirex and Chlorpheniramine Polistirex for use in adult
    patients for whom the benefits of cough suppression are expected to outweigh the risks, and in whom
    an adequate assessment of the etiology of the cough has been made.
  CONTRAINDICATIONS:
  - 4 CONTRAINDICATIONS
  - 'Hydrocodone Polistirex and Chlorpheniramine Polistirex is contraindicated for: All children younger
    than 6 years of age [ see Warnings and Precautions (5.2 , 5.3 ), Use in Specific Populations (8.4)
    ]. Hydrocodone Polistirex and Chlorpheniramine Polistirex is also contraindicated in patients with:
    Significant respiratory depression [ see Warnings and Precautions (5.2) ]. Acute or severe bronchial
    asthma in an unmonitored setting or in the absence of resuscitative equipment[ see Warnings and Precautions
    (5.4) ]. Known or suspected gastrointestinal obstruction, including paralytic ileus [ see Warnings
    and Precautions (5.9) ]. Hypersensitivity to hydrocodone, chlorpheniramine, or any of the inactive
    ingredients in Hydrocodone Polistirex and Chlorpheniramine Polistirex [ see Adverse Reactions (6)
    ].'
  - Children younger than 6 years of age. ( 4 ) Significant respiratory depression. ( 4 ) Acute or severe
    bronchial asthma in an unmonitored setting or in absence of resuscitative equipment. ( 4 ) Known or
