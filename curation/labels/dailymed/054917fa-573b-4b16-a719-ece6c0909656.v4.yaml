    ß With spermicidal cream or jelly. à Without spermicides. è The treatment schedule is one dose within
    72 hours after unprotected intercourse, and a second dose 12 hours after the first dose. The Food
    and Drug Administration has declared the following brands of combined oral contraceptives to be safe
    and effective for emergency contraception: Ovral (1 dose is 2 white pills), Alesse ® (1 dose is 5
    pink pills), Nordette ® or Levlen ® (1 dose is 4 light-orange pills), Lo/Ovral ® (1 dose is 4 white
    pills), Triphasil ® or Tri-Levlen ® (1 dose is 4 yellow pills). ð However, to maintain effective protection
    against pregnancy, another method of contraception must be used as soon as menstruation resumes, the
    frequency or duration of breastfeeds is reduced, bottle feeds are introduced, or the baby reaches
    6 months of age. Norethindrone acetate and ethinyl estradiol tablets and ferrous fumarate tablets
    were evaluated for the treatment of acne vulgaris in two randomized, double-blind, placebo-controlled,
    multicenter, Phase 3, six (28-day) cycle studies. A total of 296 patients received norethindrone acetate
    and ethinyl estradiol tablets and ferrous fumarate tablets and 295 received placebo. Mean age at enrollment
    for both groups was 24 years. At six months each study demonstrated a statistically significant difference
    between norethindrone acetate and ethinyl estradiol tablets and ferrous fumarate tablets and placebo
    for mean change from baseline in lesion counts (see Table 3 and Figure 2). Each study also demonstrated
    overall treatment success in the investigator’s global evaluation. Patients with severe androgen excess
    were not studied. Table 3. Acne Vulgaris Indication Pooled Data 376-403 and 376-404 Observed Means
