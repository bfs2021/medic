  CONTRAINDICATIONS:
  - CONTRAINDICATIONS
  - 'Norethindrone acetate and ethinyl estradiol tablets and ferrous fumarate tablets are contraindicated
    in females who are known to have or develop the following conditions: • A high risk of arterial or
    venous thrombotic diseases. Examples include women who are known to: • Smoke, if over age 35 • Have
    cerebrovascular disease • Have coronary artery disease • Have current or history of deep vein thrombosis
    or pulmonary embolism • Have thrombogenic valvular or thrombogenic rhythm diseases of the heart •
    Have inherited or acquired hypercoagulopathies • Have uncontrolled hypertension or hypertension with
    vascular disease • Have headaches with focal neurological symptoms, migraine headaches with aura,
    or over age 35 with any migraine headaches • Have diabetes mellitus and are over age 35, diabetes
    mellitus with hypertension or with vascular disease or end-organ damage, or diabetes mellitus of >
    20 years duration • Current diagnosis of, or history of, breast cancer, which may be hormone-sensitive
    • Carcinoma of the endometrium or other known or suspected estrogen-dependent neoplasia • Undiagnosed
    abnormal genital bleeding • Cholestatic jaundice of pregnancy or jaundice with prior pill use • Hepatic
    adenomas or carcinomas • Known or suspected pregnancy • Are receiving Hepatitis C drug combinations
    containing ombitasvir/paritaprevir/ritonavir, with or without dasabuvir, due to the potential for
    ALT elevations (see Warnings, RISK OF LIVER ENZYME ELEVATIONS WITH CONCOMITANT HEPATITIS C TREATMENT
    ).'
