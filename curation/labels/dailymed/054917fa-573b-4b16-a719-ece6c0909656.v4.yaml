title: Norethindrone Acetate and Ethinyl Estradiol Tablets, USP and Ferrous Fumarate Tablets**Ferrous
  fumarate tablets are not USP for dissolution and assay.
product_name: NORETHINDRONE ACETATE AND ETHINYL ESTRADIOL AND FERROUS FUMARATE
active_moieties:
- ETHINYL ESTRADIOL
- NORETHINDRONE
sections:
  INDICATIONS:
  - INDICATIONS AND USAGE
  - 'Norethindrone acetate and ethinyl estradiol tablets and ferrous fumarate tablets are indicated for
    the prevention of pregnancy in women who elect to use combined oral contraceptives as a method of
    contraception. Norethindrone acetate and ethinyl estradiol tablets and ferrous fumarate tablets are
    indicated for the treatment of moderate acne vulgaris in females, ≥ 15 years of age, who have no known
    contraindications to combined oral contraceptive therapy, desire oral contraception, have achieved
    menarche, and are unresponsive to topical anti-acne medications. Norethindrone acetate and ethinyl
    estradiol tablets and ferrous fumarate tablets should be used for the treatment of acne only if the
    patient desires a combined oral contraceptive for birth control and plans to stay on it for at least
    6 months. Combined oral contraceptives are highly effective for pregnancy prevention. Table 2 lists
    the typical accidental pregnancy rates for users of combination oral contraceptives and other methods
    of contraception. The efficacy of these contraceptive methods, except sterilization, depends upon
    the reliability with which they are used. Correct and consistent use of methods can result in lower
    failure rates. Table 2. Percentage of Women Experiencing an Unintended Pregnancy During the First
    Year of Typical Use and the First Year of Perfect Use of Contraception and the Percentage Continuing
    Use at the End of the First Year. United States. Emergency Contraceptives Pills: Treatment initiated
    within 72 hours after unprotected intercourse reduces the risk of pregnancy by at least 75%. è Lactational
